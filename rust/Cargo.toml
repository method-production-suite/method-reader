[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.11.1"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

# One version of each shared dependency for the whole port. A crate names
# what it uses with `dep.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sp-model = { path = "crates/sp-model" }
