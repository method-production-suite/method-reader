[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.11.1"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

# One version of each shared dependency for the whole port. A crate names
# what it uses with `dep.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sp-model = { path = "crates/sp-model" }
sp-mobi = { path = "crates/sp-mobi" }
# JavaScript-compatible regular expressions where the TypeScript used them.
regex = "1"
# String.prototype.normalize('NFC') for the KF8 index strings.
unicode-normalization = "0.1"
# Pure-Rust deflate, for the PNGs the MOBI picture probe draws.
miniz_oxide = "0.8"
# SHA-256 for the tests that pin a book by its digest.
sha2 = "0.10"
# Pure-Rust inflate (zlib-rs): reading a zip needs no C library.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
