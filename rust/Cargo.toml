[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "1.0.0"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

# One version of each shared dependency for the whole port. A crate names
# what it uses with `dep.workspace = true`.
[workspace.dependencies]
# Strict, pure-Rust XML reading, for tests that read a written document back.
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sp-model = { path = "crates/sp-model" }
sp-fountain = { path = "crates/sp-fountain" }
sp-mobi = { path = "crates/sp-mobi" }
# JavaScript-compatible regular expressions where the TypeScript used them.
regex = "1"
# String.prototype.normalize('NFC') for the KF8 index strings.
unicode-normalization = "0.1"
# Pure-Rust deflate, for the PNGs the MOBI picture probe draws.
miniz_oxide = "0.9"
# SHA-256 for the tests that pin a book by its digest.
sha2 = "0.10"
sp-fdx = { path = "crates/sp-fdx" }
sp-osf = { path = "crates/sp-osf" }
sp-parser = { path = "crates/sp-parser" }
sp-epub = { path = "crates/sp-epub" }
sp-azw3 = { path = "crates/sp-azw3" }
sp-device = { path = "crates/sp-device" }
sp-fsutil = { path = "crates/sp-fsutil" }
sp-engine = { path = "crates/sp-engine" }
sp-pdf = { path = "crates/sp-pdf" }
# Pure-Rust inflate (zlib-rs): reading a zip needs no C library.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Pure-Rust deflate (zlib-rs): sp-epub's zip writer. Its stream is not
# byte-identical to pako's; the parity check compares inflated entries.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# One base64 for every crate (minisign boxes, the contents API, screenshots):
# 0.23, the version plist, rpm and ureq already bring, so the lock holds one.
base64 = "0.23"
# The updater signature, made the way tauri-cli 2.11.4 makes it: the same
# crate at the same pinned version (later 0.7.x releases could not open a
# key encrypted with an empty password). Pure Rust.
minisign = "=0.7.3"
# Tar archives, written and read in pure Rust; xattr support left off.
tar = { version = "0.4", default-features = false }
sp-release = { path = "crates/sp-release" }
sp-update-config = { path = "crates/sp-update-config" }
# The suite's updater (method-libs), pinned to one full commit. Its README
# has Reader's migration notes; sp-update-config is what Reader hands it.
method-update = { git = "https://github.com/method-production-suite/method-libs", rev = "25c80f8cfcc2e5222de4c5b79413a9de488196af" }

# The picture budget (sp-parser's IMAGE_BUDGET_MS) is wall-clock, and an
# unoptimized build spends it on pixel work: a picture-heavy script that a
# release build reads in 7 s ran out of its 20 s in a debug test. Optimizing
# the pixel crates and every dependency in dev and test builds keeps the
# tests' answers the shipped program's, without loosening the budget.
# Smaller dev builds (the suite's disk rule, 2026-10-21): line tables only
# for the workspace's own crates, so backtraces still name lines, and no
# debug info at all for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.sp-parser]
opt-level = 3

[profile.dev.package.sp-pdf]
opt-level = 3
