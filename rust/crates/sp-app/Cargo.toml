[package]
name = "sp-app"
description = "The Method Reader window: every screen, drawn natively with egui, accessible through AccessKit."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# A handover-rehearsal window (sp-update's `rehearsal`): built only by
# `cargo xtask rehearse-handover prepare`, never released.
rehearsal = ["sp-update/rehearsal"]

[[bin]]
name = "method-reader-app"
path = "src/main.rs"

[dependencies]
# The toolkit, chosen in docs/superpowers/specs/2026-10-11-sp-app-design.md.
# Default features on purpose: `accesskit` (the screen reader, on every
# platform) and `wgpu` are both in them.
eframe = "0.36.2"
egui = "0.36.2"
# The fonts ship as the same WOFF2 subsets the website serves; this decodes
# them to the TrueType bytes egui's font stack reads, once, at start.
wuff = "0.2.9"
# The system's UI face is read from disk at start (src/fonts.rs); this is
# the reader egui itself parses fonts with, asked first so a face egui
# could not parse is never handed to it.
skrifa = "0.44"
# The engine's answers keep the CLI's --json shape (see src/engine.rs).
serde_json = "1"
# Native file dialogs: open a screenplay, pick a folder, save a copy.
rfd = "0.17.2"
# Reduce Motion and light/dark from the OS on Mac, Windows and Linux.
mundy = { version = "0.2.3", default-features = false, features = ["async-io", "callback", "color-scheme", "reduced-motion"] }
unicode-normalization = "0.1"
unicode-general-category = "1.1"
webbrowser = "1.2"
ureq = { version = "3", features = ["json"] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "45496d9288b063719ebeae4e0761273f7881b3d7", version = "0.3.0-beta.2" }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "45496d9288b063719ebeae4e0761273f7881b3d7", version = "0.3.0-beta.2" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "45496d9288b063719ebeae4e0761273f7881b3d7", version = "0.3.0-beta.2" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "45496d9288b063719ebeae4e0761273f7881b3d7", version = "0.3.0-beta.2" }
anyrender_vello_cpu = "0.18"
parley = "0.12"
data-url = "0.3"
cpal = "0.18"
# The updater transport and the consent carried from the Tauri window.
sp-update = { path = "../sp-update" }
# The engine, in-process: the same run() the method-reader binary is.
sp-cli = { path = "../sp-cli" }
# The window's own state file is written whole or not at all, as the
# engine's files are.
sp-fsutil.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu"] }
tempfile = "3"
# The bundled fonts are pinned by their SHA-256 (src/fonts.rs).
sha2.workspace = true
# The engine's own words about camera import, for the MTP window rules.
sp-device = { path = "../sp-device" }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6", default-features = false }
muda = "0.21"
