[package]
name = "sp-engine"
description = "Screepub's engine beyond conversion: settings, the library, export and send routes, update decisions"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sp-model.workspace = true
sp-fountain.workspace = true
sp-fdx.workspace = true
sp-parser.workspace = true
sp-epub.workspace = true
sp-mobi.workspace = true
sp-azw3.workspace = true
sp-device.workspace = true
sp-fsutil.workspace = true
sp-pdf.workspace = true
sha2 = "0.11"
regex.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe wrappers for the two process-group calls a Calibre timeout needs
# (signal the whole group, so Kindle Previewer dies with ebook-convert).
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
tempfile = "3"
zip.workspace = true
