[package]
name = "sp-update"
description = "Method Reader's updater: latest.json, minisign, the bundle swap and the restart, compatible with tauri-plugin-updater 2.12.0"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# The handover rehearsal's build: reads METHOD_READER_UPDATE_ENDPOINT,
# METHOD_READER_UPDATE_PUBKEY and METHOD_READER_UPDATE_INSECURE at compile
# time.
# Without it those values are refused (build.rs) and ignored (src/lib.rs).
# Only `cargo xtask rehearse-handover prepare` turns it on; release.yml
# never does, and xtask's tests/workflows.rs holds that.
rehearsal = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The same comparison tauri-plugin-updater 2.12.0 makes (`semver::Version`).
semver = "1"
# The same verifier tauri-plugin-updater 2.12.0 links (0.2.5 in
# desktop/src-tauri/Cargo.lock): pure Rust, no C.
minisign-verify = "0.2.5"
base64.workspace = true
# HTTPS with rustls and the webpki roots, as sp-app already builds it. The
# TLS protocol is pure Rust; the crypto provider is ring (see the release
# design, part c).
ureq = "3"
# The .app.tar.gz the Tauri bundler writes and the plugin unpacks.
flate2.workspace = true
tar.workspace = true
# CFBundleExecutable and CFBundleIdentifier, read from the bundle's own
# Info.plist (XML or binary), as tauri's restart does.
plist = "1"

[dev-dependencies]
# Signs test updates exactly as tauri-cli 2.11.4 does (its signer is this
# crate); never linked into the app.
minisign.workspace = true
tempfile = "3"
