[package]
name = "sp-parser"
description = "Method Reader's screenplay parser: what a PDF's pages say, as classified screenplay elements"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
# float_roundtrip: serde_json's default float parser can land one ULP off
# (it reads 107.99999999999999 as 108), and the oracle's numbers are pdf.js's
# exact doubles, which every threshold here is compared against.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sp-model.workspace = true
regex = "1"
# Pure-Rust deflate (zlib-rs) for the PNGs: png.ts used node:zlib.
flate2.workspace = true

[dev-dependencies]
# Reading a written PNG back.
miniz_oxide = "0.8"
# The images fixture's real decoded pixels (tests/images_fixture.rs). A dev
# dependency only: sp-pdf itself depends on this crate's facts.
sp-pdf.workspace = true
