[package]
name = "sp-release"
description = "Method Reader's release tools: the bundle layouts, the update archive, its minisign signature, latest.json, the Linux packages and the Windows installer script"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "sp-release"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
# The Windows command-line zip, written with the workspace's pure-Rust zip.
zip.workspace = true
# The Tauri updater key format: tauri-cli 2.11.4 signs with this crate, so
# a signature made here is the one every Tauri window already accepts.
minisign.workspace = true
base64.workspace = true
# The .rpm, pure Rust: gzip payload, no signature support compiled in
# (the Tauri .rpm was never signed either).
rpm = { version = "0.30", default-features = false, features = ["payload", "gzip-compression"] }
sp-update.workspace = true
# GitHub's API for `check-latest`, over the same TLS stack as sp-update.
ureq = "3"

[dev-dependencies]
tempfile = "3"
