[package]
name = "xtask"
description = "Screepub's own tooling: the oracle and the TypeScript-against-Rust parity harness"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
zip.workspace = true
regex.workspace = true
# The release tools' GitHub reads (bump-tap, check-tap, check-latest). TLS
# through rustls with RustCrypto's pure-Rust provider, so no C (no ring,
# no aws-lc) is compiled in; roots from webpki-roots.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls-rustcrypto = "0.0.2-alpha"
# The contents API and the minisign boxes are base64.
base64 = "0.22"
