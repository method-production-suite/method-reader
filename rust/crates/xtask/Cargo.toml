[package]
name = "xtask"
description = "Screepub's own tooling: the oracle and the TypeScript-against-Rust parity harness"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Look-behind, for Python textwrap's word separator (src/fixture/textwrap.rs).
fancy-regex = "0.16"
# zlib-rs at level 9 deflates make-fixture's pictures byte for byte as zlib 1.2.12 does.
flate2.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
sp-model.workspace = true
sp-fountain.workspace = true
sp-mobi.workspace = true
sp-epub = { path = "../sp-epub" }
# The release tools' GitHub reads (bump-tap, check-tap, check-latest). TLS
# through rustls with RustCrypto's pure-Rust provider, so no C (no ring,
# no aws-lc) is compiled in; roots from webpki-roots.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls-rustcrypto = "0.0.2-alpha"
# The contents API and the minisign boxes are base64.
base64 = "0.22"

[dev-dependencies]
zip.workspace = true
