[package]
name = "xtask"
description = "Method Reader's own tooling: the oracle and the TypeScript-against-Rust parity harness"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
# `cargo xtask` runs this one; the other binary is a test stand-in.
default-run = "xtask"

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

# A stand-in for Chrome, for tests/capture_chrome.rs: it writes the
# DevToolsActivePort a test's fake DevTools server needs, then waits.
[[bin]]
name = "capture-fake-chrome"
path = "src/capture/fake_chrome.rs"
test = false
doc = false

[dependencies]
# Look-behind, for Python textwrap's word separator (src/fixture/textwrap.rs).
fancy-regex = "0.16"
# zlib-rs at level 9 deflates make-fixture's pictures byte for byte as zlib 1.2.12 does.
flate2.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
miniz_oxide.workspace = true
sp-model.workspace = true
sp-fountain.workspace = true
sp-mobi.workspace = true
sp-epub = { path = "../sp-epub" }
# The release tools' GitHub reads (bump-tap, check-tap, check-latest): the
# same ureq, rustls and ring sp-release and sp-update use (one TLS stack for
# the port; rust/PARITY.md, Decisions).
ureq = "3"
# The release pipeline's library: the one signer, latest.json writer,
# archive, .deb, .rpm, .app and NSIS writers, and check-latest's judgement.
# The packaging and release commands here are thin callers of it.
sp-release.workspace = true
sp-update.workspace = true
# The contents API, the minisign boxes, the updater signature and the capture's screenshots are base64.
base64.workspace = true
# The capture tool (src/capture/): Chrome's DevTools protocol over a plain
# ws://127.0.0.1 socket (no TLS feature), reading and diffing PNGs, and
# Ctrl-C/SIGTERM so an interrupted run cleans up.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
png = "0.18"
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
zip.workspace = true
# The repo checks (tests/workflows.rs and its neighbours) read the workflows
# as the YAML GitHub runs, not as text. Deprecated upstream, but complete
# for reading, and nothing outside these tests links it.
serde_yaml = "0.9"
# The tests' throwaway keys, and tauri-cli's published test key opened with
# the pinned version.
minisign.workspace = true
# Unpacking the update archive the way tauri-plugin-updater does.
tar.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe kill(2): SIGTERM before SIGKILL, and "is that pid alive" for the
# capture's library marker.
nix = { version = "0.31", default-features = false, features = ["signal"] }
