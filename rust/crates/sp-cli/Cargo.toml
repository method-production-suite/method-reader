[package]
name = "sp-cli"
description = "The method-reader command: convert a screenplay PDF or .fountain, and the verbs that tune, export and send what it makes"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "method-reader"
path = "src/main.rs"

# The old name, kept for a few releases: one line on stderr, then exactly
# what method-reader does.
[[bin]]
name = "screepub"
path = "src/old_name.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sp-model.workspace = true
sp-fountain.workspace = true
sp-fdx.workspace = true
sp-azw3.workspace = true
sp-device.workspace = true
sp-engine.workspace = true

[dev-dependencies]
tempfile = "3"
sp-engine.workspace = true
sp-parser.workspace = true
zip.workspace = true
