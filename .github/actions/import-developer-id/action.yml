# The Developer ID certificate into a throwaway keychain, the identity's
# name into SIGN_IDENTITY, and the App Store Connect key onto disk as
# AC_API_KEY_PATH. One copy for the two jobs that sign (the command-line
# tool and the app), lifted from the Tauri-era release job unchanged:
# tauri-bundler used to do the app's half itself.
name: Import the Developer ID certificate
description: Throwaway keychain, SIGN_IDENTITY and AC_API_KEY_PATH for codesign and notarytool
inputs:
  cert-b64:
    required: true
  cert-password:
    required: true
  keychain-password:
    required: true
  ac-key-b64:
    required: true
runs:
  using: composite
  steps:
    - name: Import the certificate
      shell: bash
      env:
        CERT_B64: ${{ inputs.cert-b64 }}
        CERT_PASSWORD: ${{ inputs.cert-password }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain-password }}
      run: |
        set -euo pipefail
        KC="$RUNNER_TEMP/build.keychain-db"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
        security set-keychain-settings -lut 21600 "$KC"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
        echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$RUNNER_TEMP/cert.p12"
        security list-keychains -d user -s "$KC" login.keychain-db
        # codesign must be in the partition list, or the key is present but
        # unusable headlessly.
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
          -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
        echo "-- valid identities in the build keychain:"
        security find-identity -v -p codesigning "$KC" || true
        IDENT="$(security find-identity -v -p codesigning "$KC" \
          | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
        if [ -z "$IDENT" ]; then
          IDENT="$(security find-identity -p codesigning "$KC" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
        fi
        if [ -z "$IDENT" ]; then
          echo "::error::The imported .p12 holds no 'Developer ID Application' identity. 'Apple Development' cannot notarize; export the 'Developer ID Application:' row (docs/release-secrets.md section 1)."
          exit 1
        fi
        echo "Signing identity: $IDENT"
        echo "SIGN_IDENTITY=$IDENT" >> "$GITHUB_ENV"
    - name: Write the App Store Connect API key
      shell: bash
      env:
        AC_KEY_B64: ${{ inputs.ac-key-b64 }}
      run: |
        echo "$AC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"
        echo "AC_API_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8" >> "$GITHUB_ENV"
