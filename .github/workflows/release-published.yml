# What runs once a PERSON publishes a release: the check that reads the
# published release back. A `v*` tag only builds a
# draft (release.yml); the suite's release standard is that a person checks
# the .dmg on an Apple silicon Mac and publishes it (docs/RELEASING.md),
# and this job used to run inside the tag's run, after a job that
# published automatically.
#
# This trigger fires because a person publishes. GitHub starts no run from
# an event raised with a workflow's default GITHUB_TOKEN, which is why a
# weekly guard's own `release: published` trigger never fired at v0.5.3,
# when release.yml made the release public itself. Nothing in any
# workflow publishes a draft now (xtask/tests/release_workflow.rs holds
# that), so this one fires every time.
#
# For this event GITHUB_REF is the published release's tag, so
# `github.ref_name` is `vX.Y.Z` and the checkout is the tagged commit, as it
# was in the tag's run. Prereleases are skipped, as they were there:
# releases/latest never resolves to a prerelease. A failed job here is
# re-run from this run's page ("Re-run failed jobs").
#
# No secrets: the job reads this repository only.
name: release-published
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-published-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
jobs:
  # Read latest.json back from the endpoint every copy of the app reads, and
  # (--deep) download each archive it names and verify it the way the Rust
  # app will. Red means the release is public and updates cannot use it.
  latest-check:
    if: ${{ !github.event.release.prerelease && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The published latest.json describes the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p sp-release
          n=1
          while [ "$n" -le 3 ]; do
            if target/release/sp-release check-latest --deep; then exit 0; fi
            [ "$n" -lt 3 ] && { echo "--- attempt $n of 3, waiting 20s ---"; sleep 20; }
            n=$((n + 1))
          done
          echo "::error::The release published, but latest.json at releases/latest/download does not describe it. See docs/release-secrets.md section 4."
          exit 1
