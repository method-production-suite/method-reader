# Does the published tap actually serve the newest release?
#
# The tap is a different repo, excluded from this one locally, and until
# now no release job touched it — so no gate here ever failed for
# forgetting it. It was forgotten for FIVE releases: the per-arch
# restructure was written and locally tested at v0.4.2 but never
# committed, so every `brew install` served v0.3.0, from a single
# `screepub-macOS` asset the release workflow had already stopped
# producing.
#
# This is the STANDING guard, for drift that happens between releases: a
# tap edited by hand, a release deleted, a formula someone half-bumped.
# The per-release check is release.yml's own `tap-check` job.
#
# IT DELIBERATELY DOES NOT TRIGGER ON `release: published`. It used to, and
# that trigger never once fired: GitHub does not start new workflow runs
# from events raised by a workflow using the default GITHUB_TOKEN, and
# release.yml creates the release with exactly that token. The trigger sat
# there looking like coverage while providing none, which is the same shape
# of failure as the tap itself. The check that runs per release has to live
# INSIDE the release run, and it does.
#
# The logic lives in tools/check-tap.sh so it can be run by hand.
# Least privilege + pinned actions, matching ci.yml.
name: tap-freshness
on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC, an hour after weekly-toolchain
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tap-matches-newest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tap against the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/check-tap.sh

  # The same standing guard for the updater's manifest (piece A,
  # 2026-09-21). latest.json is read from the endpoint the app uses and
  # compared with the newest release: its version, every platform's asset,
  # every signature, and the key that made them. The per-release check is
  # release.yml's `latest-check` job, for the reason above. Red until a
  # release ships WITH the updater, since v0.6.0 publishes no manifest;
  # that red is the honest reading of "the updater cannot work yet".
  manifest-matches-newest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tools/check-latest.ts in Rust (sp-release check-latest), with --deep:
      # it also downloads each archive and verifies it the way the Rust app
      # will, which every Tauri window's looser check then passes too.
      - name: Check the updater manifest against the newest release
        working-directory: rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --release --locked -p sp-release
          target/release/sp-release check-latest --deep
