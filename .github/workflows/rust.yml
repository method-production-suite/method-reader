# Every pull request and every push to main: Method Reader is one Cargo workspace (rust/), and this is its
# check. It replaced ci.yml (the Bun engine) and desktop.yml (the Tauri
# window) at the cutover. Least privilege by default; third-party actions
# pinned to SHAs (pinact run).
#
# - rust: formatting, clippy with warnings as errors, and every crate's
#   tests on macOS, Windows and Linux, on the committed invented fixtures
#   in tests/fixtures/. The real scripts in root fixtures/ are private and
#   never reach CI. No runner here has Calibre, so the tests that run the
#   real Calibre skip; weekly-toolchain.yml runs them with Calibre.
# - parity: the release CLI against the TypeScript engine's frozen answers
#   for every committed fixture (cargo xtask parity --committed-only). The
#   answers are a Mac's, so it runs on macOS.
# - cli: the release CLI converting the fixtures, epubcheck on its books
#   (the project's stated validity gate), and cargo xtask smoke-cli; and
#   the release notes for the workspace version exist.
# - worker: the device-request Worker built for wasm32, clippy clean.
# - deny: cargo deny check against rust/deny.toml: every advisory is an
#   error unless deny.toml lists it with a reason, only the licenses the
#   notices name, crates.io and the two pinned git sources only.
# - changes: what the run needs. A draft runs nothing; documentation alone
#   runs docs (xtask's tests, which read the docs) and skips the build.
# - bundles: every installer built unsigned, opened and checked on its own
#   OS, with the window's headless smoke run out of the Mac app. On a pull
#   request only when packaging changed (the job's own comment says how).
#
# The toolchain comes from rust/rust-toolchain.toml, which rustup on every
# hosted runner installs on first use (with clippy and rustfmt), so no
# setup action is needed and the version lives in one place.
#
# Not path-filtered with paths-ignore, which would leave main's required
# checks unreported. The changes job decides instead, and each job is
# skipped by its `if:` (a skipped job counts as passing): a draft runs
# nothing, and a pull request that changes only documentation runs the docs
# job alone. Not everything that looks like documentation is: the tests read
# brand/ (the window's colours), site/ (the fonts it shares with the window,
# and the Field Station scene) and docs/releases/ (the window's notes), and
# the window and every installer carry the licences and
# THIRD-PARTY-NOTICES.md. main's ruleset requires these jobs to pass.
#
# Once per change (SUITE-STANDARDS.md section 6): the suite's runners are
# shared, so a branch runs only through its pull request, and a newer push
# to it cancels the run it replaces. main runs on every push and is never
# cancelled. A tag needs nothing here: release.yml runs its own checks.
name: rust
on:
  workflow_dispatch:
  push:
    branches: [main]
  # ready_for_review: a draft builds nothing (the changes job below is
  # skipped, and every job needs it), so marking it ready starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
# Smaller builds to cache: incremental data is useless on a fresh runner,
# and line tables keep backtraces readable without full debug info, which
# was most of target/ on Windows.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
jobs:
  # What this run needs. Skipped for a draft, and so is every job after it.
  # code: false only for a pull request whose every changed file is
  # documentation (any .md, or anything under docs/), except the files the
  # build reads (THIRD-PARTY-NOTICES.md, docs/releases/). Depth 2: a pull
  # request checks out GitHub's merge commit, whose first parent is main.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Decide whether anything but documentation changed
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "A $EVENT run checks everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet 'HEAD^1' >/dev/null; then
            echo "No parent to compare with: checking everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              THIRD-PARTY-NOTICES.md | docs/releases/*)
                code=true ;;
              *.md | docs/*)
                ;;
              *)
                code=true ;;
            esac
            if [ "$code" = true ]; then
              echo "Not documentation only: $f"
              break
            fi
          done <<< "$(git diff --name-only 'HEAD^1' HEAD)"
          if [ "$code" = false ]; then
            echo "Documentation only: the docs job checks it, the build is skipped."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  # A documentation-only pull request: xtask's tests are the ones that read
  # the docs (links, the README's pictures, the registry and the ledger),
  # on Linux alone, from main's cache.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-ubuntu-latest-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: rust-ubuntu-latest-
      - name: Linux headers
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl-dev libgtk-3-dev
      - run: cargo test -p xtask --locked --no-fail-fast
  # A matrix job skipped by its job-level `if:` reports under its bare name,
  # never as "rust (ubuntu-latest)", so main's required checks would wait
  # for ever. So this job (and bundles) is skipped only as a draft, through
  # needs; for documentation alone every step is skipped instead, and each
  # leg reports green under its own name.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 50 }}
    defaults:
      run:
        working-directory: rust
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code == 'true'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: rust-${{ matrix.os }}-
      # sp-device-requests runs its SQL against real SQLite (macOS ships the
      # tool); the window's crates need the Linux windowing and sound headers.
      - name: Linux tools and headers
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl-dev libgtk-3-dev
      - if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all --check
      - if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked --no-fail-fast
      # Only main saves (SUITE-STANDARDS section 6): a pull request restores
      # main's cache and never writes its own, so the repository stays under
      # GitHub's 10 GB and main's cache is not evicted.
      - if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}

  parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: parity-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: parity-
      # The rows whose answers depend on what is installed (Calibre, the Mac
      # apps a route can use) are reported as skipped on a runner that is
      # not the machine they were frozen on; every other row must match.
      - run: cargo xtask parity --committed-only
      # Only main saves (SUITE-STANDARDS section 6): a pull request restores
      # main's cache and never writes its own, so the repository stays under
      # GitHub's 10 GB and main's cache is not evicted.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: parity-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}

  cli:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The cheap early signal, not the gate: release.yml's checks job reads
      # the TAGGED commit and checks more (mode, size, UTF-8, no checksum).
      - name: Release notes exist for the workspace version
        run: |
          set -euo pipefail
          V="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          F="../docs/releases/$V.md"
          test -s "$F" || {
            echo "::error file=rust/Cargo.toml::rust/Cargo.toml says $V but docs/releases/$V.md is missing or empty. Every version ships notes: add that file, or revert the bump."
            exit 1
          }
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cli-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: cli-
      - run: cargo build --release --locked -p sp-cli --bin method-reader --bin screepub
      # The three fixtures whose books carry figures (registry #19a): images.pdf
      # keeps two pictures, jpx.pdf one JPEG 2000 picture, torture.pdf the
      # four the device pass looks at. A scratch library and settings folder,
      # so nothing is written beside the committed fixtures.
      - name: The release CLI converts the committed fixtures
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/books"
          mkdir -p "$W"
          export METHOD_READER_CONFIG_DIR="$W/config" METHOD_READER_LIBRARY="$W/library"
          B=target/release/method-reader
          "$B" --version
          # The old name: one line on stderr, then the same answer.
          target/release/screepub --version 2> "$W/alias.err" | grep -qx "$("$B" --version)"
          test "$(wc -l < "$W/alias.err")" -eq 1
          "$B" ../tests/fixtures/screenplay.pdf --no-fountain \
            -o "$W/smoke.epub" --mobi --azw3 "$W/smoke.azw3" --json | tee "$W/smoke.json"
          grep -q '"ok":true' "$W/smoke.json"
          grep -q '"azw3Path"' "$W/smoke.json"
          test "$(head -c 68 "$W/smoke.azw3" | tail -c 8)" = BOOKMOBI
          "$B" ../tests/fixtures/images.pdf --no-fountain -o "$W/images.epub" --json | tee "$W/images.json"
          grep -q '"imageCount":2' "$W/images.json"
          "$B" ../tests/fixtures/jpx.pdf --no-fountain -o "$W/jpx.epub" --json | tee "$W/jpx.json"
          grep -q '"imageCount":1' "$W/jpx.json"
          "$B" ../tests/fixtures/torture.pdf --no-fountain -o "$W/torture.epub" --json | tee "$W/torture.json"
          grep -q '"imageCount":4' "$W/torture.json"
      - name: epubcheck the books
        run: |
          brew install epubcheck
          for b in smoke images jpx torture; do epubcheck "$RUNNER_TEMP/books/$b.epub"; done
      - run: cargo xtask smoke-cli --binary target/release/method-reader
      - run: cargo xtask smoke-cli --binary target/release/screepub
      # Only main saves (SUITE-STANDARDS section 6): a pull request restores
      # main's cache and never writes its own, so the repository stays under
      # GitHub's 10 GB and main's cache is not evicted.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cli-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}

  # The Worker as Cloudflare would build it: wasm32, workers-rs, clippy
  # clean. Built, never deployed from here (no Cloudflare credential exists
  # in this repository).
  worker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p sp-device-requests --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo build -p sp-device-requests --target wasm32-unknown-unknown --release --locked

  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      # Built from crates.io at a pinned version with its own lock file,
      # rather than through a third-party action.
      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      # Only main saves (SUITE-STANDARDS section 6): a pull request restores
      # main's cache and never writes its own, so the repository stays under
      # GitHub's 10 GB and main's cache is not evicted.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}

  # The 14-day supply-chain cooldown (scripts/check-crate-ages.py, the suite's
  # shared copy): a crates.io package this change adds or bumps must be at
  # least 14 days old, unless scripts/crate-age-exceptions.txt names it as a
  # security fix; a git package must come from an allowlisted repository at a
  # pinned commit. Only what changed is checked, against main for a pull
  # request or the pushed-over commit for a push, so the lock as it stands
  # never blocks unrelated work.
  cooldown:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=origin/main
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            base=origin/main
          else
            base=""
          fi
          if [ -n "$base" ]; then
            python3 scripts/check-crate-ages.py --lock rust/Cargo.lock --only-changed "$base"
          else
            python3 scripts/check-crate-ages.py --lock rust/Cargo.lock
          fi

  # Every installer, unsigned, built and opened on its own OS: the Mac app
  # and its update archive (signed with a THROWAWAY key, verified the way a
  # Tauri window and the Rust app verify it), the image; the .deb installed
  # and removed, the .rpm listed, the AppImage unpacked; the NSIS installer
  # run silently and uninstalled. Signing, notarization and the real key
  # are release.yml's.
  #
  # Only when packaging can have changed. Building every installer on three
  # OSes is most of this repository's runner time, and most pull requests
  # cannot change what the installers hold. So the expensive steps run on
  # every push to main, on workflow_dispatch, and on a pull request that
  # touches the packaging (the list in the decide step); release.yml builds
  # its own installers on every tag whatever this job does. The job-level
  # `if:` is only the changes job's (drafts and documentation); the
  # packaging answer is a step, the first after checkout, with git alone
  # (no third-party action), and every later step is guarded by it, so a
  # pull request that changes no packaging finishes green in seconds.
  bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Depth 2: a pull request's run checks out GitHub's merge commit, whose
      # first parent is main, so HEAD^1..HEAD is exactly what the pull
      # request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Packaging, for this decision: the release tools and the updater they
      # sign for, xtask's bundle code, the window's manifest, icons and
      # headless mode (the smoke below runs it out of the bundle), the files
      # every installer carries, the workspace manifest (its version is the
      # installers'), the toolchain, both workflows that build installers and
      # the repository's own actions. And Cargo.lock: a lock change can change
      # what the Linux binary links, which the .deb and .rpm Depends checks
      # read, and Dependabot brings one grouped lock change a week.
      - name: Decide whether packaging changed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "A $EVENT run builds every installer."
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet 'HEAD^1' >/dev/null; then
            echo "No parent to compare with: building every installer."
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          packaging=false
          while IFS= read -r f; do
            case "$f" in
              rust/crates/sp-release/* | rust/crates/sp-update/* | \
              rust/crates/xtask/src/packaging/* | rust/crates/xtask/src/dmg.rs | \
              rust/crates/sp-app/Cargo.toml | rust/crates/sp-app/icons/* | rust/crates/sp-app/src/headless.rs | \
              rust/Cargo.toml | rust/Cargo.lock | rust/rust-toolchain.toml | \
              LICENSE-MIT | LICENSE-APACHE | rust/crates/sp-azw3/LICENSE-GPL-3.0 | THIRD-PARTY-NOTICES.md | \
              tests/fixtures/field-station.pdf | \
              .github/workflows/rust.yml | .github/workflows/release.yml | .github/actions/*)
                echo "Packaging changed: $f"
                packaging=true
                ;;
            esac
          done <<< "$(git diff --name-only 'HEAD^1' HEAD)"
          if [ "$packaging" = false ]; then
            echo "No packaging file changed: the installers are not built for this pull request."
          fi
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"
      - id: cache
        if: steps.decide.outputs.packaging == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: bundles-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: bundles-${{ matrix.os }}-
      - name: Linux packaging tools and headers
        if: steps.decide.outputs.packaging == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl-dev libgtk-3-dev
      - name: Build the window and the release tools
        if: steps.decide.outputs.packaging == 'true'
        working-directory: rust
        run: cargo build --release --locked -p sp-app -p sp-release
      - name: Lay out, package and check
        if: steps.decide.outputs.packaging == 'true'
        run: |
          set -euo pipefail
          VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' rust/Cargo.toml)"
          SP=rust/target/release/sp-release
          ICONS_DIR=rust/crates/sp-app/icons
          RES=(--resource LICENSE-MIT --resource LICENSE-APACHE --resource rust/crates/sp-azw3/LICENSE-GPL-3.0 --resource THIRD-PARTY-NOTICES.md)
          W="$RUNNER_TEMP/bundles"
          mkdir -p "$W"
          case "$RUNNER_OS" in
            macOS)
              "$SP" mac-app --version "$VERSION" --window rust/target/release/method-reader-app \
                --icon "$ICONS_DIR/icon.icns" "${RES[@]}" --out "$W/app"
              # The window's headless mode, out of the bundle: its version,
              # then a conversion in a scratch library and settings folder.
              EXE="$W/app/Method Reader.app/Contents/MacOS/method-reader-app"
              "$EXE" --version --json | tee "$W/version.json"
              grep -q "\"version\":\"$VERSION\"" "$W/version.json"
              mkdir -p "$W/smoke"
              METHOD_READER_CONFIG_DIR="$W/smoke/config" METHOD_READER_LIBRARY="$W/smoke/library" \
                "$EXE" --smoke tests/fixtures/field-station.pdf --out "$W/smoke/book.epub" | tee "$W/smoke.json"
              grep -q '"ok":true' "$W/smoke.json"
              test -s "$W/smoke/book.epub"
              "$SP" update-archive --app "$W/app/Method Reader.app" --out "$W/site/Method-Reader-macOS.app.tar.gz"
              "$SP" keygen --out "$W/keys/throwaway.key"
              TAURI_SIGNING_PRIVATE_KEY="$(cat "$W/keys/throwaway.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
                "$SP" sign-update --file "$W/site/Method-Reader-macOS.app.tar.gz" --version "$VERSION"
              "$SP" manifest --dir "$W/site" --version "$VERSION" --out "$W/site/latest.json"
              "$SP" verify-update --dir "$W/site" --manifest "$W/site/latest.json" \
                --pubkey "$(cat "$W/keys/throwaway.key.pub")"
              mkdir -p "$W/dmg"
              cp -R "$W/app/Method Reader.app" "$W/dmg/"
              ln -s /Applications "$W/dmg/Applications"
              # hdiutil create fails now and then with "Resource busy" on a
              # hosted runner (the system still scanning the new files):
              # three tries, then fail by name.
              for try in 1 2 3; do
                hdiutil create -volname "Method Reader" -srcfolder "$W/dmg" -fs HFS+ -format UDZO -ov "$W/Method-Reader-macOS.dmg" && break
                [ "$try" = 3 ] && { echo "hdiutil create failed three times"; exit 1; }
                sleep 15
              done
              M="$(mktemp -d)"
              hdiutil attach -nobrowse -readonly -mountpoint "$M" "$W/Method-Reader-macOS.dmg"
              [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$M/Method Reader.app/Contents/Info.plist")" = com.methodreader.desktop ]
              test -x "$M/Method Reader.app/Contents/MacOS/method-reader-app"
              hdiutil detach "$M"
              ;;
            Linux)
              ICONS=(--icon "32x32=$ICONS_DIR/32x32.png"
                     --icon "128x128=$ICONS_DIR/128x128.png"
                     --icon "256x256@2=$ICONS_DIR/128x128@2x.png")
              D="$RUNNER_TEMP/shlibdeps"
              mkdir -p "$D/debian"
              printf 'Source: method-reader\n\nPackage: method-reader\nArchitecture: any\n' > "$D/debian/control"
              DEPENDS="$(cd "$D" && dpkg-shlibdeps -O "$GITHUB_WORKSPACE/rust/target/release/method-reader-app" | sed -n 's/^shlibs:Depends=//p')"
              echo "Depends: $DEPENDS"
              "$SP" deb --version "$VERSION" --window rust/target/release/method-reader-app "${ICONS[@]}" "${RES[@]}" --arch amd64 --depends "$DEPENDS" --out "$W"
              "$SP" rpm --version "$VERSION" --window rust/target/release/method-reader-app "${ICONS[@]}" "${RES[@]}" --arch x86_64 --out "$W"
              dpkg-deb --info "$W/Method-Reader-linux-amd64.deb"
              # apt, not dpkg -i: it installs what Depends names first, so
              # a name the archive does not know fails here, by name.
              sudo apt-get install -y --no-install-recommends "$W/Method-Reader-linux-amd64.deb"
              test -x /usr/bin/method-reader-app
              grep -q '^Categories=Office;' /usr/share/applications/method-reader.desktop
              sudo dpkg -r method-reader
              rpm -qip "$W/Method-Reader-linux-x86_64.rpm"
              rpm -qlp "$W/Method-Reader-linux-x86_64.rpm" | grep -qx /usr/bin/method-reader-app
              # What each package declares it needs at run time: the
              # libraries the binary links (measured: dpkg-shlibdeps for the
              # .deb, the binary's NEEDED list for the .rpm) and the ones the
              # window opens itself (sp-release's LOADED_AT_RUN_TIME). Each
              # is a whole package name, as an entry or an alternative: ALSA
              # is measured here as libasound2t64, and older systems only
              # know libasound2, so both must be offered.
              dpkg-deb --field "$W/Method-Reader-linux-amd64.deb" Depends | tee "$W/depends.txt"
              for p in libasound2t64 libasound2 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-6 libegl1; do
                grep -qE -- "(^|[,|] *)$p( |,|\$)" "$W/depends.txt"
              done
              rpm -qp --requires "$W/Method-Reader-linux-x86_64.rpm" | tee "$W/requires.txt"
              for s in $(objdump -p rust/target/release/method-reader-app | awk '/NEEDED/ {print $2}') \
                       libxkbcommon.so.0 libxkbcommon-x11.so.0 libwayland-client.so.0 libX11.so.6 libEGL.so.1; do
                grep -qxF -- "$s()(64bit)" "$W/requires.txt"
              done
              "$SP" appdir --version "$VERSION" --window rust/target/release/method-reader-app "${ICONS[@]}" "${RES[@]}" --out "$W"
              test -x "$W/method-reader.AppDir/AppRun"
              ;;
            Windows)
              STAGE="$W/nsis"
              mkdir -p "$STAGE"
              cp rust/target/release/method-reader-app.exe "$STAGE/method-reader-app.exe"
              cp LICENSE-MIT LICENSE-APACHE rust/crates/sp-azw3/LICENSE-GPL-3.0 THIRD-PARTY-NOTICES.md "$ICONS_DIR/icon.ico" "$STAGE/"
              # Chocolatey's feed times out now and then (a 504), and choco
              # still exits 0: try three times, then fail by name.
              export PATH="$PATH:/c/Program Files (x86)/NSIS"
              for try in 1 2 3; do
                command -v makensis >/dev/null && break
                choco install nsis -y --no-progress || true
                command -v makensis >/dev/null || sleep 20
              done
              command -v makensis >/dev/null || { echo "makensis: NSIS did not install from Chocolatey"; exit 1; }
              "$SP.exe" nsis --version "$VERSION" --src "$(cygpath -w "$STAGE")" \
                --setup "$(cygpath -w "$W/Method-Reader-windows-x64-setup.exe")" --script "$STAGE/method-reader.nsi"
              makensis -V3 "$(cygpath -w "$STAGE/method-reader.nsi")"
              "$W/Method-Reader-windows-x64-setup.exe" //S
              test -f "$LOCALAPPDATA/Method Reader/method-reader-app.exe"
              "$LOCALAPPDATA/Method Reader/uninstall.exe" //S
              ;;
          esac
      # Only main saves (SUITE-STANDARDS section 6): a pull request restores
      # main's cache and never writes its own, so the repository stays under
      # GitHub's 10 GB and main's cache is not evicted.
      - if: steps.decide.outputs.packaging == 'true' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: bundles-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
