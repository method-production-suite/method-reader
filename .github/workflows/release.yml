# Release on version tags: the Rust app and the Rust command-line tool.
# Rewritten for the pure-Rust port (rust-port branch; design in
# docs/superpowers/specs/2026-10-11-rust-release-design.md). Same secrets,
# same published names, same order (draft, every upload, then public,
# latest.json last, then the tap), so every page, the Homebrew formula, the
# frozen Swift updater and every Tauri window keep working.
#
# Secrets (docs/release-secrets.md, unchanged names):
#   DEVELOPER_ID_CERT_P12_BASE64, CERT_PASSWORD, KEYCHAIN_PASSWORD,
#   AC_API_KEY_P8_BASE64, AC_API_KEY_ID, AC_API_ISSUER_ID,
#   TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if set),
#   TAP_TOKEN (optional).
#
# The Rust toolchain comes from rust/rust-toolchain.toml (rustup on every
# hosted runner installs it on first use). Release builds are uncached on
# purpose: a release runs a handful of times a year and builds from bytes
# fetched fresh (Cargo.lock pins every crate, --locked enforces it).
#
# Every decision lives in sp-release (rust/crates/sp-release), which is
# tested and hand-runnable; the YAML only calls it and Apple's tools.
name: release
on:
  push:
    tags: ['v*']
  # Re-run entry point: a transient notarization failure used to mean
  # deleting and re-pushing the tag. Dispatch runs against the chosen ref;
  # the version comes from the tag that ref carries.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
jobs:
  # The tag trigger is independent of rust.yml, so a tag could otherwise
  # ship from a commit whose checks fail. Same checks, gating everything.
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release notes and tag are publishable
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || {
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH. Dispatch this workflow against a version TAG, not a branch."; exit 1; }
          F="docs/releases/$VERSION.md"
          git cat-file -e "$GITHUB_SHA:$F" 2>/dev/null || {
            echo "::error file=$F::$F is missing at the tagged commit. Write it, commit it, then re-tag."; exit 1; }
          MODE="$(git ls-tree "$GITHUB_SHA" -- "$F" | awk '{print $1}')"
          [ "$MODE" = "100644" ] || { echo "::error file=$F::$F is not a regular file (mode $MODE)"; exit 1; }
          BYTES="$(git cat-file -s "$GITHUB_SHA:$F")"
          [ "$BYTES" -gt 0 ] && [ "$BYTES" -lt 60000 ] || {
            echo "::error file=$F::$F is empty or exceeds the 60000-byte body limit ($BYTES bytes)"; exit 1; }
          git cat-file blob "$GITHUB_SHA:$F" | iconv -f UTF-8 -t UTF-8 >/dev/null || {
            echo "::error file=$F::$F is not valid UTF-8"; exit 1; }
          # The workflow appends the real checksums; two on one page both
          # look official. Process substitution, not a pipe: see the
          # Tauri-era comment in git history (pipefail and SIGPIPE).
          if HITS="$(grep -niE -m 3 'sha-?256|[0-9a-f]{64}' < <(git cat-file blob "$GITHUB_SHA:$F"))"; then
            echo "::error file=$F::$F contains a checksum. The workflow appends the real ones. Offending line(s):"
            printf '%s\n' "$HITS"
            exit 1
          fi
          # The tagged commit must be ON main.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::The tagged commit is not an ancestor of origin/main. Did you amend after tagging? Re-tag the commit you actually pushed."; exit 1; }
      # ONE version file now: [workspace.package] in rust/Cargo.toml, which
      # every crate inherits (the About line, `screepub --version`, the
      # Info.plist, the package metadata). Read from the TAGGED commit.
      - name: The workspace version is the tag's
        working-directory: rust
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git cat-file blob "$GITHUB_SHA:rust/Cargo.toml" > "$RUNNER_TEMP/Cargo.toml"
          cargo run --locked --quiet -p sp-release -- version-check --version "${TAG#v}" --cargo-toml "$RUNNER_TEMP/Cargo.toml"
      - name: Formatting, lints and every test
        working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  # The command-line tool for Apple silicon: built, signed with the hardened
  # runtime (no entitlements: the Rust binary does not JIT, unlike the Bun
  # one), notarized, THEN packaged, so the tarball holds the signed bytes.
  # Then the draft release, which stays a draft until `publish`.
  release:
    needs: checks
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/import-developer-id
        with:
          cert-b64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          ac-key-b64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
      - name: Build, sign, notarize and package the macOS command-line tool
        working-directory: rust
        env:
          TAG: ${{ github.ref_name }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cargo build --release --locked -p sp-cli --bin screepub --target aarch64-apple-darwin
          cargo build --release --locked -p sp-release
          BIN="target/aarch64-apple-darwin/release/screepub"
          [ "$(lipo -archs "$BIN")" = arm64 ] || { echo "::error::$BIN is not arm64 only"; exit 1; }
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          ditto -c -k "$BIN" "$RUNNER_TEMP/screepub-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/screepub-notarize.zip" \
            --key "$AC_API_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          # A bare Mach-O cannot be stapled; Gatekeeper looks its ticket up
          # online the first time. The same was true of the Bun binary.
          "$BIN" --version | grep -qx "screepub $VERSION" \
            || { echo "::error::screepub --version does not say $VERSION"; exit 1; }
          target/release/sp-release cli-archive --binary "$BIN" --kind macos-arm64 --out "$RUNNER_TEMP/cli-mac"
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PRE=()
          [[ "$VERSION" == *-* ]] && PRE=(--prerelease)
          NOTES="$RUNNER_TEMP/notes.md"
          cp "docs/releases/$VERSION.md" "$NOTES"
          {
            printf '\n\n---\n\n'
            printf '%s\n\n' "**Mac:** download \`Screepub-macOS.dmg\` (notarized, for Macs with Apple silicon, macOS 13 or later), open it, drag Screepub to Applications, and double-click. Its SHA-256 is in \`SHA256SUMS-app\`."
            printf '%s\n' "Command-line tool for macOS, SHA-256:"
            printf '\n```\n'
            ( cd "$RUNNER_TEMP/cli-mac" && shasum -a 256 screepub-cli-macos-arm64.tar.gz )
            printf '```\n'
          } >> "$NOTES"
          # Draft first, so /releases/latest never answers with a release
          # whose files are still arriving. Idempotent under dispatch.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Screepub $VERSION" --notes-file "$NOTES" ${PRE[@]+"${PRE[@]}"}
          else
            gh release edit "$TAG" --title "Screepub $VERSION" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/cli-mac/screepub-cli-macos-arm64.tar.gz" --clobber
      - name: Tap bump crib sheet
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          ARM="$(shasum -a 256 "$RUNNER_TEMP/cli-mac/screepub-cli-macos-arm64.tar.gz" | cut -d' ' -f1)"
          # The backticks are Markdown for the summary, not a substitution.
          # shellcheck disable=SC2016
          {
            printf '## Bump ssandweiss/homebrew-tap to %s\n\n' "$V"
            printf 'Run `cargo xtask bump-tap %s <tap-checkout>` from rust/: it writes `Formula/screepub.rb` whole.\n\n```ruby\n' "$V"
            printf '  url ".../download/v%s/screepub-cli-macos-arm64.tar.gz"\n  sha256 "%s"\n' "$V" "$ARM"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  # The other command-line tools, each built AND run on its own OS: Rust
  # does not cross-compile a whole OS's worth of libraries the way Bun did,
  # and a native runner is also the smoke test. linux-arm64 now runs on
  # GitHub's arm64 runner, so it is executed in CI for the first time.
  cli:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux-x64
            archive: screepub-cli-linux-x64.tar.gz
            exe: screepub
          - os: ubuntu-24.04-arm
            kind: linux-arm64
            archive: screepub-cli-linux-arm64.tar.gz
            exe: screepub
          - os: windows-latest
            kind: windows-x64
            archive: screepub-cli-windows-x64.zip
            exe: screepub.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, run and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Two builds, not one: `--bin screepub` alongside `-p sp-release`
          # limits BOTH packages to a bin named screepub, so sp-release's own
          # binary was never built and the archive step found nothing (v0.12.0).
          cargo build --release --locked -p sp-cli --bin screepub
          cargo build --release --locked -p sp-release --bin sp-release
          BIN="target/release/${{ matrix.exe }}"
          "$BIN" --version | grep -qx "screepub $VERSION" || { echo "::error::screepub --version does not say screepub $VERSION"; exit 1; }
          # Convert the committed fixtures, the JPEG 2000 one included, as
          # cargo xtask smoke-cli does, in a scratch folder with empty settings.
          W="$(mktemp -d)"
          for f in screenplay jpx; do
            SCREEPUB_CONFIG_DIR="$W/config" SCREEPUB_LIBRARY="$W/library" \
              "$BIN" "../tests/fixtures/$f.pdf" --json > "$W/$f.json"
            grep -Eq '"ok": ?true' "$W/$f.json" || { cat "$W/$f.json"; echo "::error::$f.pdf did not convert"; exit 1; }
          done
          SCREEPUB_CONFIG_DIR="$W/config" "$BIN" devices --json > /dev/null
          target/release/sp-release cli-archive --binary "$BIN" --kind ${{ matrix.kind }} --out "$RUNNER_TEMP/cli"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.kind }}
          path: ${{ runner.temp }}/cli/${{ matrix.archive }}
          retention-days: 1
          if-no-files-found: error

  cli-upload:
    needs: [release, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli
      - name: Checksum, check the count, upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd cli
          sha256sum screepub-cli-linux-x64.tar.gz screepub-cli-linux-arm64.tar.gz screepub-cli-windows-x64.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release upload "$TAG" screepub-cli-linux-x64.tar.gz screepub-cli-linux-arm64.tar.gz \
            screepub-cli-windows-x64.zip SHA256SUMS --clobber

  # The installable apps: ONE signed and notarized DMG (Apple silicon), the
  # signed update archive the Tauri windows and the Rust app install, a
  # .deb, an .rpm and an AppImage, and one unsigned NSIS installer.
  app-bundles:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/import-developer-id
        if: runner.os == 'macOS'
        with:
          cert-b64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          ac-key-b64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
      - name: Linux build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl-dev libgtk-3-dev
      - name: Build the window and the release tools
        working-directory: rust
        run: |
          set -euo pipefail
          # The handover rehearsal's updater values (a local endpoint, a
          # throwaway key, plain HTTP) never reach a release: sp-update's
          # build.rs refuses them without its rehearsal feature, and this
          # says so before cargo starts.
          for v in SCREEPUB_UPDATE_ENDPOINT SCREEPUB_UPDATE_PUBKEY SCREEPUB_UPDATE_INSECURE; do
            if [ -n "${!v+set}" ]; then
              echo "::error::$v is set: a release never carries the handover rehearsal's updater values"
              exit 1
            fi
          done
          if [ "$RUNNER_OS" = macOS ]; then
            cargo build --release --locked -p sp-app --target aarch64-apple-darwin
          else
            cargo build --release --locked -p sp-app
          fi
          cargo build --release --locked -p sp-release
      - name: macOS app, update archive and image
        if: runner.os == 'macOS'
        env:
          TAG: ${{ github.ref_name }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Refuse to start without the update key: a release that cannot
          # sign its update is the one ADR 2026-09-21 forbids.
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          SP=rust/target/release/sp-release
          WIN=rust/target/aarch64-apple-darwin/release/screepub-window
          [ "$(lipo -archs "$WIN")" = arm64 ] || { echo "::error::the window is not arm64 only"; exit 1; }
          mkdir -p bundles
          "$SP" mac-app --version "$VERSION" --window "$WIN" \
            --icon rust/crates/sp-app/icons/icon.icns \
            --resource LICENSE --resource THIRD-PARTY-NOTICES.md --out "$RUNNER_TEMP/app"
          APP="$RUNNER_TEMP/app/Screepub.app"
          # Inside out, never --deep: every executable in Contents/MacOS,
          # then the bundle. Hardened runtime, timestamp, no entitlements.
          for exe in "$APP"/Contents/MacOS/*; do
            codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$exe"
          done
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The designated requirement the frozen Swift updater and TCC
          # compare: the identifier and the team, as before.
          codesign -d -r- "$APP" 2>&1 | tee "$RUNNER_TEMP/requirement.txt"
          grep -q 'identifier "com.darkwell.screepub"' "$RUNNER_TEMP/requirement.txt"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-notarize.zip" \
            --key "$AC_API_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -t exec -vv "$APP"
          # The update archive is made from the stapled bundle, so a Tauri
          # window installs exactly what Gatekeeper approved.
          "$SP" update-archive --app "$APP" --out bundles/Screepub-macOS.app.tar.gz
          "$SP" sign-update --file bundles/Screepub-macOS.app.tar.gz --version "$VERSION"
          # The image: the app and an Applications link, signed, notarized,
          # stapled. hdiutil is what tauri-bundler's dmg script ran.
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$APP" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname Screepub -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov bundles/Screepub-macOS.dmg
          codesign --force --timestamp --sign "$SIGN_IDENTITY" bundles/Screepub-macOS.dmg
          xcrun notarytool submit bundles/Screepub-macOS.dmg \
            --key "$AC_API_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple bundles/Screepub-macOS.dmg
          xcrun stapler validate bundles/Screepub-macOS.dmg
          spctl -a -t open --context context:primary-signature -v bundles/Screepub-macOS.dmg
      - name: Linux packages
        if: runner.os == 'Linux'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SP=rust/target/release/sp-release
          WIN=rust/target/release/screepub-window
          # Depends: measured on the binary, never guessed.
          D="$RUNNER_TEMP/shlibdeps"
          mkdir -p "$D/debian"
          printf 'Source: screepub\n\nPackage: screepub\nArchitecture: any\n' > "$D/debian/control"
          DEPENDS="$(cd "$D" && dpkg-shlibdeps -O "$GITHUB_WORKSPACE/$WIN" | sed -n 's/^shlibs:Depends=//p')"
          echo "Depends: $DEPENDS"
          ICONS=(--icon "32x32=rust/crates/sp-app/icons/32x32.png"
                 --icon "128x128=rust/crates/sp-app/icons/128x128.png"
                 --icon "256x256@2=rust/crates/sp-app/icons/128x128@2x.png")
          RES=(--resource LICENSE --resource THIRD-PARTY-NOTICES.md)
          mkdir -p bundles
          "$SP" deb --version "$VERSION" --window "$WIN" "${ICONS[@]}" "${RES[@]}" --arch amd64 --depends "$DEPENDS" --out bundles
          "$SP" rpm --version "$VERSION" --window "$WIN" "${ICONS[@]}" "${RES[@]}" --arch x86_64 --out bundles
          "$SP" appdir --version "$VERSION" --window "$WIN" "${ICONS[@]}" "${RES[@]}" --out "$RUNNER_TEMP"
          # appimagetool and its runtime, pinned by digest (GitHub's own
          # record of each asset, read 2026-10-11).
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c
          curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run \
            --runtime-file "$RUNNER_TEMP/runtime-x86_64" \
            "$RUNNER_TEMP/Screepub.AppDir" bundles/Screepub-linux-x86_64.AppImage
      - name: Windows installer
        if: runner.os == 'Windows'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          STAGE="$RUNNER_TEMP/nsis"
          mkdir -p "$STAGE" bundles
          cp rust/target/release/screepub-window.exe "$STAGE/screepub-desktop.exe"
          cp LICENSE THIRD-PARTY-NOTICES.md rust/crates/sp-app/icons/icon.ico "$STAGE/"
          # Chocolatey's feed times out now and then (a 504), and choco
          # still exits 0: try three times, then fail by name.
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          for try in 1 2 3; do
            command -v makensis >/dev/null && break
            choco install nsis -y --no-progress || true
            command -v makensis >/dev/null || sleep 20
          done
          command -v makensis >/dev/null || { echo "makensis: NSIS did not install from Chocolatey"; exit 1; }
          rust/target/release/sp-release.exe nsis --version "$VERSION" \
            --src "$(cygpath -w "$STAGE")" --setup "$(cygpath -w "$PWD/bundles/Screepub-windows-x64-setup.exe")" \
            --script "$STAGE/screepub.nsi"
          makensis -V3 "$(cygpath -w "$STAGE/screepub.nsi")"
      # Built is not installed. Each bundle is opened on the machine that
      # built it and checked for the files and the version it claims.
      - name: Check each bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          N=0
          for B in bundles/*; do
            # An empty folder leaves the glob literal: count nothing, so
            # the check below says so, instead of "unexpected file bundles/*".
            [ -e "$B" ] || continue
            case "$B" in
              *.dmg)
                M="$(mktemp -d)"
                hdiutil attach -nobrowse -readonly -mountpoint "$M" "$B"
                PL="$M/Screepub.app/Contents/Info.plist"
                [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL")" = "$VERSION" ]
                [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")" = com.darkwell.screepub ]
                codesign --verify --deep --strict "$M/Screepub.app"
                hdiutil detach "$M"
                ;;
              *.app.tar.gz)
                M="$(mktemp -d)"
                tar -xzf "$B" -C "$M"
                [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$M/Screepub.app/Contents/Info.plist")" = "$VERSION" ]
                codesign --verify --deep --strict "$M/Screepub.app"
                xcrun stapler validate "$M/Screepub.app"
                ;;
              *.deb)
                dpkg-deb --info "$B" | grep -q "Version: $VERSION"
                # Measured libraries and the ones the window opens itself,
                # each a whole package name (an entry or an alternative):
                # ALSA is measured as libasound2t64, and older systems only
                # know libasound2, so both must be offered.
                DEP="$(dpkg-deb --field "$B" Depends)"
                for p in libasound2t64 libasound2 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-6 libegl1; do
                  grep -qE -- "(^|[,|] *)$p( |,|\$)" <<<"$DEP"
                done
                # apt, not dpkg -i: it installs what Depends names first.
                sudo apt-get install -y --no-install-recommends "$(realpath "$B")"
                test -x /usr/bin/screepub-desktop
                grep -q '^Categories=Office;' /usr/share/applications/Screepub.desktop
                sudo dpkg -r screepub
                ;;
              *.rpm)
                rpm -qip "$B" | grep -q "Version *: $VERSION"
                REQ="$(rpm -qp --requires "$B")"
                for s in libasound.so.2 libfontconfig.so.1 libxkbcommon.so.0 libxkbcommon-x11.so.0 libwayland-client.so.0 libX11.so.6 libEGL.so.1; do
                  grep -qxF -- "$s()(64bit)" <<<"$REQ"
                done
                rpm -qlp "$B" | grep -qx /usr/bin/screepub-desktop
                ;;
              *.AppImage)
                M="$(mktemp -d)"
                (cd "$M" && "$GITHUB_WORKSPACE/$B" --appimage-extract >/dev/null)
                test -x "$M/squashfs-root/usr/bin/screepub-desktop"
                ;;
              *.exe)
                "$B" //S
                test -f "$LOCALAPPDATA/Screepub/screepub-desktop.exe"
                "$LOCALAPPDATA/Screepub/uninstall.exe" //S
                ;;
              *.sig) continue ;;
              *) echo "::error::unexpected file $B"; exit 1 ;;
            esac
            N=$((N + 1))
          done
          [ "$N" -gt 0 ] || { echo "::error::bundles/ held nothing. NOTHING WAS CHECKED."; exit 1; }
          echo "$N bundle(s) checked on this runner."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-bundles-${{ matrix.os }}
          path: bundles/*
          retention-days: 1
          if-no-files-found: error

  # Before latest.json can offer this release to anyone: the shipped
  # v0.11.1 window's own updater (tauri-plugin-updater 2.12.0, run headless
  # by rust/handover-proof on tauri's mock runtime, with the public key the
  # v0.11.1 tauri.conf.json carries) installs THIS release's signed archive
  # over the bundle v0.11.1 actually published. If the window that is out
  # there could not take this update, nothing is published that offers it.
  handover-gate:
    needs: app-bundles
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-bundles-macos-15
          path: new
      - name: The v0.11.1 window installs this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OLD=v0.11.1
          mkdir -p old/Applications site
          gh release download "$OLD" --pattern Screepub-macOS.app.tar.gz --dir old
          tar -xzf old/Screepub-macOS.app.tar.gz -C old/Applications
          test -d old/Applications/Screepub.app
          PUB="$(git show "$OLD:desktop/src-tauri/tauri.conf.json" | plutil -extract plugins.updater.pubkey raw -o - -)"
          (cd rust && cargo build --release --locked -p sp-release)
          (cd rust/handover-proof && cargo build --release --locked)
          cp new/Screepub-macOS.app.tar.gz new/Screepub-macOS.app.tar.gz.sig site/
          rust/target/release/sp-release serve --dir site --port 0 > serve.out 2> serve.log &
          SERVE=$!
          n=0
          until grep -q 'http://' serve.out 2>/dev/null; do
            n=$((n + 1)); [ "$n" -lt 50 ] || { echo "::error::the local server did not start"; exit 1; }; sleep 0.1
          done
          BASE="$(sed -n 's/.* at \(http:[^ ]*\)$/\1/p' serve.out)"
          rust/target/release/sp-release manifest --dir site --version "$VERSION" --out site/latest.json --asset-base "$BASE"
          STATUS=0
          rust/handover-proof/target/release/handover-proof --bundle old/Applications/Screepub.app \
            --endpoint "$BASE/latest.json" --pubkey "$PUB" --current 0.11.1 || STATUS=$?
          kill "$SERVE" || true
          cat serve.log
          [ "$STATUS" = 0 ] || { echo "::error::the v0.11.1 window's updater could not install this release; latest.json is NOT published"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' old/Applications/Screepub.app/Contents/Info.plist)" = "$VERSION" ]
          [ ! -e old/Applications/Screepub.app/Contents/MacOS/screepub-engine ]
          codesign --verify --deep --strict old/Applications/Screepub.app

  # The bundles onto the draft, then latest.json LAST, built from what
  # arrived and verified against the key every Screepub trusts before it
  # goes up (the manifest points at files by url; uploaded first, it would
  # describe files not there yet).
  app-upload:
    needs: [release, app-bundles, handover-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-bundles-*
          merge-multiple: true
          path: arrivals
      - name: Checksums from what arrived, then the count
        run: |
          set -euo pipefail
          cd arrivals
          rm -f SHA256SUMS-app
          # Bare names on purpose: they are what SHA256SUMS-app lists, and
          # every one starts with "Screepub-", never a dash.
          # shellcheck disable=SC2035
          sha256sum *.deb *.rpm *.AppImage *.dmg *.exe > SHA256SUMS-app
          # One .deb, one .rpm, one AppImage, ONE .dmg (the frozen Swift
          # updater takes the first on the page) and one .exe.
          LINES="$(wc -l < SHA256SUMS-app)"
          [ "$LINES" -eq 5 ] || { echo "::error::expected 5 app bundles, got $LINES:"; cat SHA256SUMS-app; exit 1; }
          sha256sum -c SHA256SUMS-app
      - name: Upload the bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd arrivals
          # shellcheck disable=SC2035
          gh release upload "$TAG" *.deb *.rpm *.AppImage *.dmg *.exe \
            Screepub-macOS.app.tar.gz Screepub-macOS.app.tar.gz.sig SHA256SUMS-app --clobber
      - name: Build latest.json from what arrived, verify it, publish it last
        working-directory: rust
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::$TAG is a prerelease, so no latest.json is published: releases/latest/download never resolves to a prerelease."
            exit 0
          fi
          cargo build --release --locked -p sp-release
          target/release/sp-release manifest --dir ../arrivals --version "$VERSION" --out ../arrivals/latest.json
          # Every platform verifies with the shipped key and the signed
          # version (the Rust app's rule; a Tauri window's is the same with
          # the version optional), or nothing is published.
          target/release/sp-release verify-update --dir ../arrivals --manifest ../arrivals/latest.json
          gh release upload "$TAG" ../arrivals/latest.json --clobber

  # Public HERE, last of the uploads. A failed bundle leg never strands the
  # release in draft; a wrong image list does (the frozen Swift updater).
  publish:
    needs: [release, cli-upload, app-upload, handover-gate]
    # A failed handover gate keeps the release a draft: a public release
    # whose update the windows already out there cannot take is the one
    # thing worse than a late one.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.handover-gate.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Exactly one Mac image, then make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DMGS="$(gh release view "$TAG" --json assets \
            -q '[.assets[].name | select(endswith(".dmg"))] | join(" ")')"
          case "$DMGS" in
            "Screepub-macOS.dmg") ;;
            "") echo "::warning::$TAG has no Mac image (did a bundle leg fail?). Publishing anyway; re-run app-upload to attach it." ;;
            *) echo "::error::$TAG must carry exactly one .dmg, Screepub-macOS.dmg. It has: $DMGS."; exit 1 ;;
          esac
          PRE=()
          [[ "$VERSION" == *-* ]] && PRE=(--prerelease)
          gh release edit "$TAG" --draft=false ${PRE[@]+"${PRE[@]}"}

  tap:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump the Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::TAP_TOKEN is not set, so the tap was NOT bumped. Use the crib sheet in this run's summary. tap-freshness.yml will fail until the tap serves $V."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/ssandweiss/homebrew-tap.git" tap
          (cd rust && cargo xtask bump-tap "$V" "$GITHUB_WORKSPACE/tap")
          if git -C tap diff --quiet; then
            echo "::notice::the tap already serves $V; nothing to commit"
            exit 0
          fi
          brew style tap/Formula/screepub.rb tap/Casks/screepub.rb
          git -C tap -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -am "Screepub $V"
          git -C tap push

  tap-check:
    needs: tap
    if: ${{ !cancelled() && needs.tap.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tap serves this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd rust && cargo build --quiet --locked -p xtask)
          n=1
          while [ "$n" -le 3 ]; do
            if rust/target/debug/xtask check-tap; then exit 0; fi
            [ "$n" -lt 3 ] && { echo "--- attempt $n of 3, waiting 20s ---"; sleep 20; }
            n=$((n + 1))
          done
          echo "::error::The release published, but the Homebrew tap does not serve it. Run (from rust/): cargo xtask bump-tap ${GITHUB_REF_NAME#v} <tap-checkout>, then commit and push."
          exit 1

  # Read latest.json back from the endpoint every Screepub reads, and
  # (--deep) download each archive it names and verify it the way the Rust
  # app will. Red means the release is public and updates cannot use it.
  latest-check:
    needs: [app-upload, publish]
    if: ${{ !cancelled() && needs.app-upload.result == 'success' && needs.publish.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The published latest.json describes the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p sp-release
          n=1
          while [ "$n" -le 3 ]; do
            if target/release/sp-release check-latest --deep; then exit 0; fi
            [ "$n" -lt 3 ] && { echo "--- attempt $n of 3, waiting 20s ---"; sleep 20; }
            n=$((n + 1))
          done
          echo "::error::The release published, but latest.json at releases/latest/download does not describe it. See docs/release-secrets.md section 4."
          exit 1
