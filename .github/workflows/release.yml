# Release on version tags: the Rust app and the Rust command-line tool.
# Rewritten for the pure-Rust port (rust-port branch; design in
# docs/superpowers/specs/2026-10-11-rust-release-design.md). The published
# names are Method Reader's since 0.13 (Screepub's up to 0.12.x, all in
# rust/crates/sp-release/src/names.rs); the updaters already out there read
# latest.json and drop the archive's top folder, so the new names reach them
# unchanged.
#
# The suite's release standard (SUITE-STANDARDS.md section 3; the steps in
# docs/RELEASING.md): a tag builds a DRAFT, and a PERSON publishes it after
# checking the .dmg on an Apple silicon Mac. Nothing here makes the release
# public. The order is the draft, every upload, latest.json last, then
# `draft-check`, which reads the draft back and fails loudly unless every
# file is there. Publishing starts release-published.yml: the Homebrew tap,
# then the checks that read the published release back. That trigger fires
# because a person publishes; GitHub starts no run from an event raised with
# this workflow's default token.
#
# Secrets (docs/release-secrets.md, unchanged names):
#   DEVELOPER_ID_CERT_P12_BASE64, CERT_PASSWORD, KEYCHAIN_PASSWORD,
#   AC_API_KEY_P8_BASE64, AC_API_KEY_ID, AC_API_ISSUER_ID,
#   TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if set).
#   TAP_TOKEN (optional) is release-published.yml's.
#
# The Rust toolchain comes from rust/rust-toolchain.toml (rustup on every
# hosted runner installs it on first use). Release builds are uncached on
# purpose: a release runs a handful of times a year and builds from bytes
# fetched fresh (Cargo.lock pins every crate, --locked enforces it).
#
# Every decision lives in sp-release (rust/crates/sp-release), which is
# tested and hand-runnable; the YAML only calls it and Apple's tools.
name: release
on:
  push:
    tags: ['v*']
  # Re-run entry point: a transient notarization failure used to mean
  # deleting and re-pushing the tag. Dispatch runs against the chosen ref;
  # the version comes from the tag that ref carries.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
jobs:
  # The tag trigger is independent of rust.yml, so a tag could otherwise
  # ship from a commit whose checks fail. Same checks, gating everything.
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release notes and tag are publishable
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || {
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH. Dispatch this workflow against a version TAG, not a branch."; exit 1; }
          F="docs/releases/$VERSION.md"
          git cat-file -e "$GITHUB_SHA:$F" 2>/dev/null || {
            echo "::error file=$F::$F is missing at the tagged commit. Write it, commit it, then re-tag."; exit 1; }
          MODE="$(git ls-tree "$GITHUB_SHA" -- "$F" | awk '{print $1}')"
          [ "$MODE" = "100644" ] || { echo "::error file=$F::$F is not a regular file (mode $MODE)"; exit 1; }
          BYTES="$(git cat-file -s "$GITHUB_SHA:$F")"
          [ "$BYTES" -gt 0 ] && [ "$BYTES" -lt 60000 ] || {
            echo "::error file=$F::$F is empty or exceeds the 60000-byte body limit ($BYTES bytes)"; exit 1; }
          git cat-file blob "$GITHUB_SHA:$F" | iconv -f UTF-8 -t UTF-8 >/dev/null || {
            echo "::error file=$F::$F is not valid UTF-8"; exit 1; }
          # The workflow appends the real checksums; two on one page both
          # look official. Process substitution, not a pipe: see the
          # Tauri-era comment in git history (pipefail and SIGPIPE).
          if HITS="$(grep -niE -m 3 'sha-?256|[0-9a-f]{64}' < <(git cat-file blob "$GITHUB_SHA:$F"))"; then
            echo "::error file=$F::$F contains a checksum. The workflow appends the real ones. Offending line(s):"
            printf '%s\n' "$HITS"
            exit 1
          fi
          # The tagged commit must be ON main.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::The tagged commit is not an ancestor of origin/main. Did you amend after tagging? Re-tag the commit you actually pushed."; exit 1; }
      # ONE version file now: [workspace.package] in rust/Cargo.toml, which
      # every crate inherits (the About line, `method-reader --version`, the
      # Info.plist, the package metadata). Read from the TAGGED commit.
      - name: The workspace version is the tag's
        working-directory: rust
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git cat-file blob "$GITHUB_SHA:rust/Cargo.toml" > "$RUNNER_TEMP/Cargo.toml"
          cargo run --locked --quiet -p sp-release -- version-check --version "${TAG#v}" --cargo-toml "$RUNNER_TEMP/Cargo.toml"
      - name: Formatting, lints and every test
        working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  # The command-line tool for Apple silicon, and its old name `screepub`
  # (sp-cli's second binary: it says once that the tool was renamed, then
  # does exactly what method-reader does): built, signed with the hardened
  # runtime (no entitlements: the Rust binary does not JIT, unlike the Bun
  # one), notarized, THEN packaged, so the tarball holds the signed bytes.
  # Then the draft release, which stays a draft until a person publishes it.
  release:
    needs: checks
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/import-developer-id
        with:
          cert-b64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          ac-key-b64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
      - name: Build, sign, notarize and package the macOS command-line tool
        working-directory: rust
        env:
          TAG: ${{ github.ref_name }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cargo build --release --locked -p sp-cli --bin method-reader --bin screepub --target aarch64-apple-darwin
          cargo build --release --locked -p sp-release
          BIN="target/aarch64-apple-darwin/release/method-reader"
          ALIAS="target/aarch64-apple-darwin/release/screepub"
          STAGE="$RUNNER_TEMP/cli-notarize"
          mkdir -p "$STAGE"
          # Each under its own identifier: the tool's new one, and the one
          # the CLI was signed with up to 0.12.x on its old name.
          for pair in "$BIN:method-reader-cli-arm64" "$ALIAS:screepub-cli-arm64"; do
            B="${pair%%:*}"
            [ "$(lipo -archs "$B")" = arm64 ] || { echo "::error::$B is not arm64 only"; exit 1; }
            codesign --force --options runtime --timestamp --identifier "${pair##*:}" --sign "$SIGN_IDENTITY" "$B"
            codesign --verify --strict --verbose=2 "$B"
            cp "$B" "$STAGE/"
          done
          ditto -c -k "$STAGE" "$RUNNER_TEMP/method-reader-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/method-reader-notarize.zip" \
            --key "$AC_API_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          # A bare Mach-O cannot be stapled; Gatekeeper looks its ticket up
          # online the first time. The same was true of the Bun binary.
          "$BIN" --version | grep -qx "method-reader $VERSION (Method Reader)" \
            || { echo "::error::method-reader --version does not say $VERSION"; exit 1; }
          "$ALIAS" --version 2>/dev/null | grep -qx "method-reader $VERSION (Method Reader)" \
            || { echo "::error::the screepub alias does not behave like method-reader"; exit 1; }
          target/release/sp-release cli-archive --binary "$BIN" --alias "$ALIAS" --kind macos-arm64 --out "$RUNNER_TEMP/cli-mac"
      - name: Write the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PRE=()
          [[ "$VERSION" == *-* ]] && PRE=(--prerelease)
          NOTES="$RUNNER_TEMP/notes.md"
          cp "docs/releases/$VERSION.md" "$NOTES"
          {
            printf '\n\n---\n\n'
            printf '%s\n\n' "**Mac:** download \`Method-Reader-macOS.dmg\` (notarized, for Macs with Apple silicon, macOS 13 or later), open it, drag Method Reader to Applications, and double-click. Its SHA-256 is in \`SHA256SUMS-app\`."
            printf '%s\n' "Command-line tool for macOS, SHA-256:"
            printf '\n```\n'
            ( cd "$RUNNER_TEMP/cli-mac" && shasum -a 256 method-reader-cli-macos-arm64.tar.gz )
            printf '```\n'
          } >> "$NOTES"
          # Draft first, so /releases/latest never answers with a release
          # whose files are still arriving. Idempotent under dispatch.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Method Reader $VERSION" --notes-file "$NOTES" ${PRE[@]+"${PRE[@]}"}
          else
            gh release edit "$TAG" --title "Method Reader $VERSION" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/cli-mac/method-reader-cli-macos-arm64.tar.gz" --clobber
      - name: Tap bump crib sheet
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          ARM="$(shasum -a 256 "$RUNNER_TEMP/cli-mac/method-reader-cli-macos-arm64.tar.gz" | cut -d' ' -f1)"
          # The backticks are Markdown for the summary, not a substitution.
          # shellcheck disable=SC2016
          {
            printf '## Bump ssandweiss/homebrew-tap to %s\n\n' "$V"
            printf 'The tap bumps itself once the release is published (release-published.yml). By hand: run `cargo xtask bump-tap %s <tap-checkout>` from rust/: it writes `Formula/method-reader.rb` whole (and renames a tap still on screepub.rb).\n\n```ruby\n' "$V"
            printf '  url ".../download/v%s/method-reader-cli-macos-arm64.tar.gz"\n  sha256 "%s"\n' "$V" "$ARM"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  # The other command-line tools, each built AND run on its own OS: Rust
  # does not cross-compile a whole OS's worth of libraries the way Bun did,
  # and a native runner is also the smoke test. linux-arm64 now runs on
  # GitHub's arm64 runner, so it is executed in CI for the first time.
  cli:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux-x64
            archive: method-reader-cli-linux-x64.tar.gz
            exe: method-reader
            alias: screepub
          - os: ubuntu-24.04-arm
            kind: linux-arm64
            archive: method-reader-cli-linux-arm64.tar.gz
            exe: method-reader
            alias: screepub
          - os: windows-latest
            kind: windows-x64
            archive: method-reader-cli-windows-x64.zip
            exe: method-reader.exe
            alias: screepub.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, run and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Two builds, not one: `--bin method-reader` alongside
          # `-p sp-release` limits BOTH packages to bins of those names, so
          # sp-release's own binary was never built and the archive step
          # found nothing (v0.12.0).
          cargo build --release --locked -p sp-cli --bin method-reader --bin screepub
          cargo build --release --locked -p sp-release --bin sp-release
          BIN="target/release/${{ matrix.exe }}"
          ALIAS="target/release/${{ matrix.alias }}"
          "$BIN" --version | grep -qx "method-reader $VERSION (Method Reader)" || { echo "::error::method-reader --version does not say method-reader $VERSION (Method Reader)"; exit 1; }
          "$ALIAS" --version 2>/dev/null | grep -qx "method-reader $VERSION (Method Reader)" || { echo "::error::the screepub alias does not behave like method-reader"; exit 1; }
          # Convert the committed fixtures, the JPEG 2000 one included, as
          # cargo xtask smoke-cli does, in a scratch folder with empty settings.
          W="$(mktemp -d)"
          for f in screenplay jpx; do
            METHOD_READER_CONFIG_DIR="$W/config" METHOD_READER_LIBRARY="$W/library" \
              "$BIN" "../tests/fixtures/$f.pdf" --json > "$W/$f.json"
            grep -Eq '"ok": ?true' "$W/$f.json" || { cat "$W/$f.json"; echo "::error::$f.pdf did not convert"; exit 1; }
          done
          METHOD_READER_CONFIG_DIR="$W/config" "$BIN" devices --json > /dev/null
          target/release/sp-release cli-archive --binary "$BIN" --alias "$ALIAS" --kind ${{ matrix.kind }} --out "$RUNNER_TEMP/cli"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.kind }}
          path: ${{ runner.temp }}/cli/${{ matrix.archive }}
          retention-days: 1
          if-no-files-found: error

  cli-upload:
    needs: [release, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli
      - name: Checksum, check the count, upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd cli
          sha256sum method-reader-cli-linux-x64.tar.gz method-reader-cli-linux-arm64.tar.gz method-reader-cli-windows-x64.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release upload "$TAG" method-reader-cli-linux-x64.tar.gz method-reader-cli-linux-arm64.tar.gz \
            method-reader-cli-windows-x64.zip SHA256SUMS --clobber

  # The installable apps: ONE signed and notarized DMG (Apple silicon), the
  # signed update archive the Tauri windows and the Rust app install, a
  # .deb, an .rpm and an AppImage, and one unsigned NSIS installer.
  app-bundles:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/import-developer-id
        if: runner.os == 'macOS'
        with:
          cert-b64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          ac-key-b64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
      - name: Linux build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl-dev libgtk-3-dev
      - name: Build the window and the release tools
        working-directory: rust
        run: |
          set -euo pipefail
          # The handover rehearsal's updater values (a local endpoint, a
          # throwaway key, plain HTTP) never reach a release: sp-update's
          # build.rs refuses them without its rehearsal feature, and this
          # says so before cargo starts.
          for v in METHOD_READER_UPDATE_ENDPOINT METHOD_READER_UPDATE_PUBKEY METHOD_READER_UPDATE_INSECURE; do
            if [ -n "${!v+set}" ]; then
              echo "::error::$v is set: a release never carries the handover rehearsal's updater values"
              exit 1
            fi
          done
          if [ "$RUNNER_OS" = macOS ]; then
            cargo build --release --locked -p sp-app --target aarch64-apple-darwin
          else
            cargo build --release --locked -p sp-app
          fi
          cargo build --release --locked -p sp-release
      - name: macOS app, update archive and image
        if: runner.os == 'macOS'
        env:
          TAG: ${{ github.ref_name }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Refuse to start without the update key: a release that cannot
          # sign its update is the one ADR 2026-09-21 forbids.
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          SP=rust/target/release/sp-release
          WIN=rust/target/aarch64-apple-darwin/release/method-reader-app
          [ "$(lipo -archs "$WIN")" = arm64 ] || { echo "::error::the window is not arm64 only"; exit 1; }
          mkdir -p bundles
          "$SP" mac-app --version "$VERSION" --window "$WIN" \
            --icon rust/crates/sp-app/icons/icon.icns \
            --resource LICENSE-MIT --resource LICENSE-APACHE --resource rust/crates/sp-azw3/LICENSE-GPL-3.0 --resource THIRD-PARTY-NOTICES.md --out "$RUNNER_TEMP/app"
          APP="$RUNNER_TEMP/app/Method Reader.app"
          # Inside out, never --deep: every executable in Contents/MacOS,
          # then the bundle. Hardened runtime, timestamp, no entitlements.
          for exe in "$APP"/Contents/MacOS/*; do
            codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$exe"
          done
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The designated requirement TCC compares: the identifier and the
          # team. From 0.13 the identifier is Method Reader's own
          # (com.methodreader.desktop; 0.12.x was com.darkwell.screepub), so
          # macOS asks for its permissions again once. The 0.12 updater swaps
          # by folder and never compares it.
          codesign -d -r- "$APP" 2>&1 | tee "$RUNNER_TEMP/requirement.txt"
          grep -q 'identifier "com.methodreader.desktop"' "$RUNNER_TEMP/requirement.txt"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-notarize.zip" \
            --key "$AC_API_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -t exec -vv "$APP"
          # The update archive is made from the stapled bundle, so a Tauri
          # window installs exactly what Gatekeeper approved.
          "$SP" update-archive --app "$APP" --out bundles/Method-Reader-macOS.app.tar.gz
          "$SP" sign-update --file bundles/Method-Reader-macOS.app.tar.gz --version "$VERSION"
          # The image: the app and an Applications link, signed, notarized,
          # stapled. hdiutil is what tauri-bundler's dmg script ran.
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$APP" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Method Reader" -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov bundles/Method-Reader-macOS.dmg
          codesign --force --timestamp --sign "$SIGN_IDENTITY" bundles/Method-Reader-macOS.dmg
          xcrun notarytool submit bundles/Method-Reader-macOS.dmg \
            --key "$AC_API_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple bundles/Method-Reader-macOS.dmg
          xcrun stapler validate bundles/Method-Reader-macOS.dmg
          spctl -a -t open --context context:primary-signature -v bundles/Method-Reader-macOS.dmg
      - name: Linux packages
        if: runner.os == 'Linux'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SP=rust/target/release/sp-release
          WIN=rust/target/release/method-reader-app
          # Depends: measured on the binary, never guessed.
          D="$RUNNER_TEMP/shlibdeps"
          mkdir -p "$D/debian"
          printf 'Source: method-reader\n\nPackage: method-reader\nArchitecture: any\n' > "$D/debian/control"
          DEPENDS="$(cd "$D" && dpkg-shlibdeps -O "$GITHUB_WORKSPACE/$WIN" | sed -n 's/^shlibs:Depends=//p')"
          echo "Depends: $DEPENDS"
          ICONS=(--icon "32x32=rust/crates/sp-app/icons/32x32.png"
                 --icon "128x128=rust/crates/sp-app/icons/128x128.png"
                 --icon "256x256@2=rust/crates/sp-app/icons/128x128@2x.png")
          RES=(--resource LICENSE-MIT --resource LICENSE-APACHE --resource rust/crates/sp-azw3/LICENSE-GPL-3.0 --resource THIRD-PARTY-NOTICES.md)
          mkdir -p bundles
          "$SP" deb --version "$VERSION" --window "$WIN" "${ICONS[@]}" "${RES[@]}" --arch amd64 --depends "$DEPENDS" --out bundles
          "$SP" rpm --version "$VERSION" --window "$WIN" "${ICONS[@]}" "${RES[@]}" --arch x86_64 --out bundles
          "$SP" appdir --version "$VERSION" --window "$WIN" "${ICONS[@]}" "${RES[@]}" --out "$RUNNER_TEMP"
          # appimagetool and its runtime, pinned by digest (GitHub's own
          # record of each asset, read 2026-10-11).
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c
          curl -fsSL -o "$RUNNER_TEMP/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run \
            --runtime-file "$RUNNER_TEMP/runtime-x86_64" \
            "$RUNNER_TEMP/method-reader.AppDir" bundles/Method-Reader-linux-x86_64.AppImage
      - name: Windows installer
        if: runner.os == 'Windows'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          STAGE="$RUNNER_TEMP/nsis"
          mkdir -p "$STAGE" bundles
          cp rust/target/release/method-reader-app.exe "$STAGE/method-reader-app.exe"
          cp LICENSE-MIT LICENSE-APACHE rust/crates/sp-azw3/LICENSE-GPL-3.0 THIRD-PARTY-NOTICES.md rust/crates/sp-app/icons/icon.ico "$STAGE/"
          # Chocolatey's feed times out now and then (a 504), and choco
          # still exits 0: try three times, then fail by name.
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          for try in 1 2 3; do
            command -v makensis >/dev/null && break
            choco install nsis -y --no-progress || true
            command -v makensis >/dev/null || sleep 20
          done
          command -v makensis >/dev/null || { echo "makensis: NSIS did not install from Chocolatey"; exit 1; }
          rust/target/release/sp-release.exe nsis --version "$VERSION" \
            --src "$(cygpath -w "$STAGE")" --setup "$(cygpath -w "$PWD/bundles/Method-Reader-windows-x64-setup.exe")" \
            --script "$STAGE/method-reader.nsi"
          makensis -V3 "$(cygpath -w "$STAGE/method-reader.nsi")"
      # Built is not installed. Each bundle is opened on the machine that
      # built it and checked for the files and the version it claims.
      - name: Check each bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          N=0
          for B in bundles/*; do
            # An empty folder leaves the glob literal: count nothing, so
            # the check below says so, instead of "unexpected file bundles/*".
            [ -e "$B" ] || continue
            case "$B" in
              *.dmg)
                M="$(mktemp -d)"
                hdiutil attach -nobrowse -readonly -mountpoint "$M" "$B"
                PL="$M/Method Reader.app/Contents/Info.plist"
                [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL")" = "$VERSION" ]
                [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")" = com.methodreader.desktop ]
                codesign --verify --deep --strict "$M/Method Reader.app"
                hdiutil detach "$M"
                ;;
              *.app.tar.gz)
                M="$(mktemp -d)"
                tar -xzf "$B" -C "$M"
                [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$M/Method Reader.app/Contents/Info.plist")" = "$VERSION" ]
                codesign --verify --deep --strict "$M/Method Reader.app"
                xcrun stapler validate "$M/Method Reader.app"
                ;;
              *.deb)
                dpkg-deb --info "$B" | grep -q "Version: $VERSION"
                # Measured libraries and the ones the window opens itself,
                # each a whole package name (an entry or an alternative):
                # ALSA is measured as libasound2t64, and older systems only
                # know libasound2, so both must be offered.
                DEP="$(dpkg-deb --field "$B" Depends)"
                for p in libasound2t64 libasound2 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-6 libegl1; do
                  grep -qE -- "(^|[,|] *)$p( |,|\$)" <<<"$DEP"
                done
                # apt, not dpkg -i: it installs what Depends names first.
                # It takes the old package's place.
                dpkg-deb --field "$B" Replaces | grep -q '^screepub '
                dpkg-deb --field "$B" Conflicts | grep -q '^screepub '
                sudo apt-get install -y --no-install-recommends "$(realpath "$B")"
                test -x /usr/bin/method-reader-app
                grep -q '^Categories=Office;' /usr/share/applications/method-reader.desktop
                sudo dpkg -r method-reader
                ;;
              *.rpm)
                rpm -qip "$B" | grep -q "Version *: $VERSION"
                REQ="$(rpm -qp --requires "$B")"
                for s in libasound.so.2 libfontconfig.so.1 libxkbcommon.so.0 libxkbcommon-x11.so.0 libwayland-client.so.0 libX11.so.6 libEGL.so.1; do
                  grep -qxF -- "$s()(64bit)" <<<"$REQ"
                done
                rpm -qlp "$B" | grep -qx /usr/bin/method-reader-app
                rpm -qp --obsoletes "$B" | grep -q "^screepub <"
                ;;
              *.AppImage)
                M="$(mktemp -d)"
                (cd "$M" && "$GITHUB_WORKSPACE/$B" --appimage-extract >/dev/null)
                test -x "$M/squashfs-root/usr/bin/method-reader-app"
                ;;
              *.exe)
                "$B" //S
                test -f "$LOCALAPPDATA/Method Reader/method-reader-app.exe"
                "$LOCALAPPDATA/Method Reader/uninstall.exe" //S
                ;;
              *.sig) continue ;;
              *) echo "::error::unexpected file $B"; exit 1 ;;
            esac
            N=$((N + 1))
          done
          [ "$N" -gt 0 ] || { echo "::error::bundles/ held nothing. NOTHING WAS CHECKED."; exit 1; }
          echo "$N bundle(s) checked on this runner."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-bundles-${{ matrix.os }}
          path: bundles/*
          retention-days: 1
          if-no-files-found: error

  # Before latest.json can offer this release to anyone: the shipped
  # v0.11.1 window's own updater (tauri-plugin-updater 2.12.0, run headless
  # by rust/handover-proof on tauri's mock runtime, with the public key the
  # v0.11.1 tauri.conf.json carries) installs THIS release's signed archive
  # over the bundle v0.11.1 actually published, at its own path
  # (Screepub.app: the old updaters swap in place, whatever the new name).
  # If the window that is out there could not take this update, nothing is
  # published that offers it.
  handover-gate:
    needs: app-bundles
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-bundles-macos-15
          path: new
      - name: The v0.11.1 window installs this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OLD=v0.11.1
          mkdir -p old/Applications site
          gh release download "$OLD" --pattern Screepub-macOS.app.tar.gz --dir old
          tar -xzf old/Screepub-macOS.app.tar.gz -C old/Applications
          test -d old/Applications/Screepub.app
          PUB="$(git show "$OLD:desktop/src-tauri/tauri.conf.json" | plutil -extract plugins.updater.pubkey raw -o - -)"
          (cd rust && cargo build --release --locked -p sp-release)
          (cd rust/handover-proof && cargo build --release --locked)
          cp new/Method-Reader-macOS.app.tar.gz new/Method-Reader-macOS.app.tar.gz.sig site/
          rust/target/release/sp-release serve --dir site --port 0 > serve.out 2> serve.log &
          SERVE=$!
          n=0
          until grep -q 'http://' serve.out 2>/dev/null; do
            n=$((n + 1)); [ "$n" -lt 50 ] || { echo "::error::the local server did not start"; exit 1; }; sleep 0.1
          done
          BASE="$(sed -n 's/.* at \(http:[^ ]*\)$/\1/p' serve.out)"
          rust/target/release/sp-release manifest --dir site --version "$VERSION" --out site/latest.json --asset-base "$BASE"
          STATUS=0
          rust/handover-proof/target/release/handover-proof --bundle old/Applications/Screepub.app \
            --endpoint "$BASE/latest.json" --pubkey "$PUB" --current 0.11.1 || STATUS=$?
          kill "$SERVE" || true
          cat serve.log
          [ "$STATUS" = 0 ] || { echo "::error::the v0.11.1 window's updater could not install this release; latest.json is NOT published"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' old/Applications/Screepub.app/Contents/Info.plist)" = "$VERSION" ]
          [ ! -e old/Applications/Screepub.app/Contents/MacOS/screepub-engine ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' old/Applications/Screepub.app/Contents/Info.plist)" = method-reader-app ]
          codesign --verify --deep --strict old/Applications/Screepub.app

  # The bundles onto the draft, then latest.json LAST, built from what
  # arrived and verified against the key every copy of the app trusts before it
  # goes up (the manifest points at files by url; uploaded first, it would
  # describe files not there yet).
  app-upload:
    needs: [release, app-bundles, handover-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-bundles-*
          merge-multiple: true
          path: arrivals
      - name: Checksums from what arrived, then the count
        run: |
          set -euo pipefail
          cd arrivals
          rm -f SHA256SUMS-app
          # Bare names on purpose: they are what SHA256SUMS-app lists, and
          # every one starts with "Method-Reader-", never a dash.
          # shellcheck disable=SC2035
          sha256sum *.deb *.rpm *.AppImage *.dmg *.exe > SHA256SUMS-app
          # One .deb, one .rpm, one AppImage, ONE .dmg (the frozen Swift
          # updater takes the first on the page) and one .exe.
          LINES="$(wc -l < SHA256SUMS-app)"
          [ "$LINES" -eq 5 ] || { echo "::error::expected 5 app bundles, got $LINES:"; cat SHA256SUMS-app; exit 1; }
          sha256sum -c SHA256SUMS-app
      - name: Upload the bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd arrivals
          # shellcheck disable=SC2035
          gh release upload "$TAG" *.deb *.rpm *.AppImage *.dmg *.exe \
            Method-Reader-macOS.app.tar.gz Method-Reader-macOS.app.tar.gz.sig SHA256SUMS-app --clobber
      - name: Build latest.json from what arrived, verify it, publish it last
        working-directory: rust
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::$TAG is a prerelease, so no latest.json is published: releases/latest/download never resolves to a prerelease."
            exit 0
          fi
          cargo build --release --locked -p sp-release
          target/release/sp-release manifest --dir ../arrivals --version "$VERSION" --out ../arrivals/latest.json
          # Every platform verifies with the shipped key and the signed
          # version (the Rust app's rule; a Tauri window's is the same with
          # the version optional), or nothing is published.
          target/release/sp-release verify-update --dir ../arrivals --manifest ../arrivals/latest.json
          gh release upload "$TAG" ../arrivals/latest.json --clobber

  # LAST: read the draft back and say whether it is complete. A person
  # publishes it (docs/RELEASING.md), and this is what they read first: a
  # draft missing its Mac image or its latest.json, once public, breaks the
  # site's download buttons and every window's update check (v0.12.1 went
  # public that way). It runs even when a job before it failed, so the run
  # says in one place what is missing. It changes nothing; write access is
  # only because GitHub shows a draft to no token that cannot write.
  draft-check:
    needs: [release, cli-upload, app-upload, handover-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Every job before it succeeded
        env:
          RELEASE: ${{ needs.release.result }}
          CLI_UPLOAD: ${{ needs.cli-upload.result }}
          APP_UPLOAD: ${{ needs.app-upload.result }}
          HANDOVER_GATE: ${{ needs.handover-gate.result }}
        run: |
          set -euo pipefail
          BAD=""
          for pair in "release=$RELEASE" "cli-upload=$CLI_UPLOAD" "app-upload=$APP_UPLOAD" "handover-gate=$HANDOVER_GATE"; do
            [ "${pair#*=}" = success ] || BAD="$BAD ${pair%%=*} (${pair#*=})"
          done
          [ -z "$BAD" ] || {
            echo "::error::The draft is NOT ready to publish. These jobs did not succeed:$BAD. Re-run the failed jobs, then read this check again."; exit 1; }
      - name: The draft carries every file the release names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Exactly one Mac image: the frozen Swift updater takes the first
          # .dmg on the page.
          DMGS="$(gh release view "$TAG" --json assets \
            -q '[.assets[].name | select(endswith(".dmg"))] | join(" ")')"
          case "$DMGS" in
            "Method-Reader-macOS.dmg") ;;
            "") echo "::error::$TAG has no Mac image, so do not publish it. Re-run the failed jobs."; exit 1 ;;
            *) echo "::error::$TAG must carry exactly one .dmg, Method-Reader-macOS.dmg. It has: $DMGS. Do not publish it."; exit 1 ;;
          esac
          ASSETS="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          # Every file the jobs above upload. latest.json only for a
          # release: app-upload publishes none for a prerelease, because
          # releases/latest never resolves to one.
          WANT=(method-reader-cli-macos-arm64.tar.gz method-reader-cli-linux-x64.tar.gz method-reader-cli-linux-arm64.tar.gz method-reader-cli-windows-x64.zip SHA256SUMS Method-Reader-linux-amd64.deb Method-Reader-linux-x86_64.rpm Method-Reader-linux-x86_64.AppImage Method-Reader-macOS.dmg Method-Reader-windows-x64-setup.exe Method-Reader-macOS.app.tar.gz Method-Reader-macOS.app.tar.gz.sig SHA256SUMS-app)
          [[ "$VERSION" == *-* ]] || WANT+=(latest.json)
          MISSING=""
          for f in "${WANT[@]}"; do
            grep -qxF -- "$f" <<<"$ASSETS" || MISSING="$MISSING $f"
          done
          [ -z "$MISSING" ] || {
            echo "::error::$TAG is missing:$MISSING. Do not publish it. Re-run the failed jobs."; exit 1; }
          # The backticks are Markdown for the summary, not a substitution.
          # shellcheck disable=SC2016
          {
            printf '## Method Reader %s is a complete draft\n\n' "$VERSION"
            printf 'Before you publish it: download `Method-Reader-macOS.dmg` from the draft on an Apple silicon Mac, open it, drag Method Reader to Applications, and open the app once (it must open without a warning). Then publish the draft on https://github.com/%s/releases. Publishing bumps the Homebrew tap (release-published.yml). The steps are in docs/RELEASING.md.\n' "$GH_REPO"
          } >> "$GITHUB_STEP_SUMMARY"
