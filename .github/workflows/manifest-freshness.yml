# Does the published updater manifest actually describe the newest release?
#
# This is the STANDING guard, for drift that happens between releases: a
# release deleted, an asset replaced by hand, a manifest someone
# half-edited. The per-release check is release-published.yml's
# `latest-check` job.
#
# IT DELIBERATELY DOES NOT TRIGGER ON `release: published`. A weekly guard
# here used to, and at v0.5.3 that trigger never once fired: GitHub does
# not start new workflow runs from events raised by a workflow using the
# default GITHUB_TOKEN, and release.yml then made the release public with
# exactly that token. The trigger sat there looking like coverage while
# providing none. Since the suite's release standard a PERSON publishes
# the draft, so that event now starts release-published.yml, and nothing in
# any workflow publishes (xtask/tests/release_workflow.rs holds that). This
# file stays the weekly guard for drift between releases.
#
# Least privilege + pinned actions, matching rust.yml.
name: manifest-freshness
on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC, an hour after weekly-toolchain
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # latest.json is read from the endpoint the app uses and compared with
  # the newest release: its version, every platform's asset, every
  # signature, and the key that made them.
  manifest-matches-newest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # sp-release check-latest, with --deep:
      # it also downloads each archive and verifies it the way the Rust app
      # will, which every Tauri window's looser check then passes too.
      - name: Check the updater manifest against the newest release
        working-directory: rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --release --locked -p sp-release
          target/release/sp-release check-latest --deep
