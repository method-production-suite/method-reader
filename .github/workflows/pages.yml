# Deploy site/ to GitHub Pages. Path-filtered so engine work never triggers a
# site deploy, and site work never waits on one. The site is HTML and CSS
# with no build step: nothing here runs any code of ours.
#
# Pages CANNOT deploy a branch subfolder (branch deploys only offer / and
# /docs), which is why this uses the Actions source instead of "deploy from a
# branch". Settings -> Pages -> Source must be set to "GitHub Actions" once, by
# hand, or this workflow succeeds and publishes nothing.
#
# Third-party actions are pinned to SHAs, matching rust.yml and release.yml. Bump
# with `pinact run`, never by hand-editing the tag comment.
name: pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: a half-published site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # `site` is the whole artifact: the site is static, self-contained, and
      # has no build step on purpose. CNAME rides along inside it.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
