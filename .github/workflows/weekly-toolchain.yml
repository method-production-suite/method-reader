# The tests that run the real Calibre (Calibre's own reader opens
# Method Reader's AZW3 and lays our EPUB's dialogue column out with its margins,
# KEPUB carries koboSpan markup, the KFX plugin listing and status probe,
# the MOBI round trips) skip on a machine without Calibre, and no runner in
# full.yml has it. Weekly is the right cadence: they guard against CALIBRE
# behaviour changes, which arrive on Calibre's schedule, not this repo's.
# Least privilege and pinned actions, matching full.yml.
name: weekly-toolchain
on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch:
permissions:
  contents: read
# The same build settings as full.yml, so its cache fits.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
jobs:
  # The whole workspace's tests, against whatever Calibre Homebrew serves
  # this week, so a Calibre release whose reader rejects our AZW3, or that
  # breaks KEPUB, the plugin listing or the config isolation, goes red
  # within a week instead of surfacing only on the maintainer's Mac.
  #
  # Every test that starts Calibre hands it a scratch COPY of the (here
  # empty) Calibre settings folder through CALIBRE_CONFIG_DIRECTORY, and
  # every other test hands the engine a guard path Calibre can neither read
  # nor create, so nothing here can reach a real Calibre folder.
  #
  # Kindle Previewer and the KFX Output plugin are NOT installed, so the
  # real KFX conversion skips; the KFX tests that run use Calibre alone.
  engine-calibre:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Borrows full.yml's macOS cache and never saves one of its own, so
      # a weekly run adds nothing to the repository's 10 GB.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-macos-15-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: rust-macos-15-
      - name: Install Calibre
        run: brew install --cask calibre
      # The Calibre tests skip without Calibre, so a Calibre the engine can
      # no longer FIND would leave this job green while testing nothing.
      # METHOD_READER_REQUIRE_CALIBRE makes sp-engine's tests/calibre_found.rs
      # fail instead, by the engine's own discovery rule.
      - name: Every test, with Calibre installed
        env:
          METHOD_READER_REQUIRE_CALIBRE: '1'
        run: cargo test --workspace --locked

  # The whole lock against the 14-day rule, every Monday: a crate that was
  # young when it slipped in, or one yanked since, goes red within a week.
  crate-ages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every crate in the lock
        run: python3 scripts/check-crate-ages.py --lock rust/Cargo.lock
