# The engine's Calibre-dependent tests (AZW3 keeps the dialogue column's
# margins; KEPUB carries koboSpan markup; the KFX plugin listing) are gated
# on an installed Calibre, which no ci.yml runner has. Weekly is the right
# cadence: they guard against CALIBRE behavior changes, which arrive on
# brew's schedule, not this repo's. Until piece F3 this file also ran the
# Swift Mac app's own Calibre checks; that job went with the app.
# Least privilege + pinned actions, matching ci.yml.
name: weekly-toolchain
on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The ENGINE's Calibre tests, against whatever Calibre brew serves this
  # week. ci.yml's runners have no Calibre, so there every test that needs
  # a real ebook-convert or calibre-customize skips, and a Calibre release
  # that breaks AZW3, KEPUB, the plugin listing or the config isolation
  # would otherwise surface only on the maintainer's Mac. Here it goes red
  # within a week.
  #
  # Run from the repo root with bun alone, on purpose: it never depended
  # on the Swift job that used to sit beside it, which is why deleting that
  # job left this one untouched. `bun test` from the root picks up
  # bunfig.toml's preloads and .env.test, so every Calibre spawn reads a
  # scratch copy of the (here empty) Calibre settings folder, never a real
  # one.
  #
  # Kindle Previewer and the KFX Output plugin are NOT installed, so the
  # real KFX conversion test skips; the KFX tests that run use Calibre
  # alone (the plugin listing, the status probe, the install snippet's
  # stubbed run).
  engine-calibre:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install Calibre
        run: brew install --cask calibre
      # The tests below skip without Calibre, so a Calibre the engine can
      # no longer FIND would leave this job green while testing nothing.
      # Fail here instead, by the engine's own discovery rule.
      - name: The engine finds Calibre
        run: |
          bun -e "
            import { calibreTool } from './src/export/calibre';
            for (const t of ['ebook-convert', 'calibre-customize', 'calibre-debug']) {
              const p = calibreTool(t);
              if (!p) { console.error('the engine cannot find ' + t); process.exit(1); }
              console.log(t + ': ' + p);
            }
          "
      - name: Engine tests that run the real Calibre
        run: >-
          bun test
          tests/export-calibre.test.ts
          tests/export-kfx.test.ts
          tests/cli-export.test.ts
          tests/cli-kfx.test.ts
          tests/calibre-config-isolation.test.ts
