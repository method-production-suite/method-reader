# Least privilege by default. Pin third-party actions to SHAs (pinact run).
# The engine's integration tests run here, on the committed invented
# fixtures in tests/fixtures/; nothing self-skips for want of them (that
# guard was removed: see tests/fixture-stability.test.ts). The real scripts
# in root fixtures/ are private and never reach CI. No runner here has
# Calibre, so the engine's Calibre tests skip;
# .github/workflows/weekly-toolchain.yml runs them with Calibre.
name: ci
# site/ and brand/ ship to a browser, not into a converted book, and neither
# is touched by the engine suite. Skipping them keeps a copy edit off the
# runners. Safe to path-filter because no check here is a required status:
# a filtered-out job never reports, which would hang a PR under branch
# protection. Re-check that if protection is ever turned on.
on:
  push:
    paths-ignore: ['site/**', 'brand/**']
  pull_request:
    paths-ignore: ['site/**', 'brand/**']
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # This is the CHEAP EARLY SIGNAL, not the authoritative gate -- that
      # is release.yml's `checks` job, which runs at the actually-tagged
      # commit and checks more than this step does. Three differences on
      # purpose, all failing in the SAFE direction (this step passing is
      # not proof the tag will): `test -s` FOLLOWS symlinks, so a
      # symlinked notes file is green here and only caught at tag time;
      # this checks package.json's version against HEAD, while release.yml
      # checks the TAGGED commit, so `git tag -a v0.5.0 <old-sha>` passes
      # here and fails there; and this never runs the checksum, UTF-8 or
      # size checks release.yml does. Do not read parity into a green run
      # of this step alone.
      - name: Release notes exist for the current version
        run: |
          set -euo pipefail
          V="$(bun --print "require('./package.json').version")"
          F="docs/releases/$V.md"
          test -s "$F" || {
            echo "::error file=package.json::package.json says $V but $F is missing or empty. Every version ships notes: add that file, or revert the bump."
            exit 1
          }
  # The shipped CLI is the bun-COMPILED binary, whose distinct failure
  # modes (pdf.js's dynamic worker import, the inlined package.json) only
  # exist after compilation — before this job they were first exercised
  # when a release tag already existed. epubcheck is the project's stated
  # validity gate (CLAUDE.md); now a structural EPUB regression fails a
  # push instead of reaching users.
  artifact:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun build --compile src/cli.ts --outfile build/screepub-engine
      - name: Compiled binary converts the committed fixture
        run: |
          ./build/screepub-engine --version
          ./build/screepub-engine tests/fixtures/screenplay.pdf \
            -o "$RUNNER_TEMP/smoke.epub" --mobi --json | tee "$RUNNER_TEMP/smoke.json"
          grep -q '"ok":true' "$RUNNER_TEMP/smoke.json"
      - name: epubcheck the output
        run: |
          brew install epubcheck
          epubcheck "$RUNNER_TEMP/smoke.epub"
  # Bun cross-compiles every target from one machine, so a broken target is
  # a red push instead of a surprise at tag time. The verification lives in
  # tools/build-cli.ts, which is unit-tested and hand-runnable; this job is
  # a thin caller, because a build matrix expressed in YAML can only ever be
  # tested by cutting a release.
  #
  # It does NOT replace the `artifact` job above: that one runs epubcheck,
  # the project's stated validity gate, and needs Homebrew.
  cross-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Bun downloads each cross-compile target's runtime bundle on demand,
      # into its install cache. Measured cost of NOT caching this: deleting
      # bun-{linux,windows}-x64-<version> (95MB + 111MB) made the build-cli
      # tests alone go from 0.7s warm to 5.04s cold, plus the ~200MB refetch
      # from Bun's registry — and this job would otherwise pay that on every
      # push and PR. `bun pm cache` reports the real path rather than
      # assuming XDG layout, and the key carries the Bun version because the
      # bundles are version-specific.
      - name: Locate Bun's install cache
        id: bun-cache
        run: |
          set -euo pipefail
          echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "version=$(bun --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-cross-compile-${{ steps.bun-cache.outputs.version }}
      - run: bun install --frozen-lockfile
      - name: Cross-compile every CLI target and verify the binary formats
        run: |
          set -euo pipefail
          V="$(bun --print "require('./package.json').version")"
          bun tools/build-cli.ts --version "$V" --out "$RUNNER_TEMP/cli"
      - name: The linux-x64 artifact actually runs here
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/cli/screepub-cli-linux-x64.tar.gz" -C "$RUNNER_TEMP"
          bun tools/smoke-cli.ts --binary "$RUNNER_TEMP/screepub"
