name: Bug report
description: Method Reader misbehaved, such as a crash, a failed transfer or a broken control
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Which computer?
      options:
        - Mac
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which part of Method Reader?
      options:
        - The app (Method Reader, on a Mac, Windows or Linux)
        - The command line (method-reader)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Method Reader and system versions
      description: The app shows its version at the foot of the page; the command line with `method-reader --version`.
      placeholder: Method Reader 0.13.0, macOS 15.6, Apple silicon
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: E-reader involved, if any
      placeholder: Kobo Clara, connected over USB
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        If the command line was involved, the output of the same conversion
        with `--json` is useful. Please redact anything confidential first.
      render: shell
