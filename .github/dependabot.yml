# Dependabot version updates.
#
# Security ALERTS are separate and need no config — enable them in
# Settings, then Code security. They're the higher-value half and cover
# the PDF stack even if the PRs below prove fiddly.
version: 2
updates:
  # GitHub Actions are a supply-chain surface: a compromised action runs
  # with our release secrets. We pin to SHAs; Dependabot bumps the hash
  # and keeps the trailing version comment honest, which hand-pinning
  # never does reliably. (checkout sat three majors behind on v4 until
  # a Node 20 deprecation warning surfaced it.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # The Rust workspace. The crates that read UNTRUSTED input matter most:
  # the PDF stack under sp-pdf (the whole point of this app is opening
  # PDFs other people made), the zip and image decoders, and the TLS stack
  # the updater speaks through. Cargo.lock pins every crate, CI builds with
  # --locked, so a bump arrives only as one of these PRs.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Majors wait longer: they carry breaking-change risk on top of
    # supply-chain risk, and the parity checks ride on the PDF stack's
    # behaviour staying put.
    cooldown:
      default-days: 1
      semver-major-days: 30
    groups:
      # One PR for routine bumps; security fixes still arrive separately
      # and immediately via Dependabot alerts.
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
