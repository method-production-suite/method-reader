# Dependabot version updates (SUITE-STANDARDS.md section 6): one grouped
# pull request a week per ecosystem, never for releases younger than the
# 14-day crate cooldown that CI's crate-age check holds every change to.
#
# Security updates are GitHub's own and stay separate, one pull request
# each, so a fix is never held up by a batch: the group below applies to
# version updates only. Security ALERTS need no config here; they are
# enabled in Settings, then Code security.
#
# GitHub Actions are left out on purpose: they stay pinned to the suite's
# shared SHAs, which MOrg moves for every repository at once, so the repos
# never drift apart (a security alert on an action still reaches MOrg).
#
# rust/handover-proof is left out too: its own lock pins Tauri exactly as
# the shipped Tauri windows have it, which is the point of the proof, and
# a version bump there would test code no window runs.
version: 2
updates:
  # The Rust workspace. The crates that read UNTRUSTED input matter most:
  # the PDF stack under sp-pdf (the whole point of this app is opening
  # PDFs other people made), the zip and image decoders, and the TLS stack
  # the updater speaks through. Cargo.lock pins every crate, CI builds with
  # --locked, so a bump arrives only as one of these PRs.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    # Majors wait longer: they carry breaking-change risk on top of
    # supply-chain risk, and the parity checks ride on the PDF stack's
    # behaviour staying put.
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      cargo-weekly:
        applies-to: version-updates
        patterns: ["*"]
