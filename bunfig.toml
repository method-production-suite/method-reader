# Supply-chain hardening, mirrored from the machine-level policy in
# ~/.bunfig.toml (IT-General security arm · ticket IT-18) so it applies in
# CI too — the runner holds the Developer ID signing key, and a global
# config on one laptop does not travel with the repo.
#
# minimumReleaseAge is in SECONDS. Verified empirically against bun 1.3.14
# on 2026-07-28, both directions: 604800 blocked a 2.6-hour-old package,
# while 600 and 60 admitted it. The machine-level ~/.bunfig.toml comment
# claiming MINUTES is wrong — its 10080 is 2.8 hours, not 7 days, so that
# policy has been running 60x weaker than intended. Fix it there too.
#
# 86400 = 24 hours. Malicious npm releases are overwhelmingly caught within
# hours (ua-parser-js ~4h, coa/rc similar), so the protection curve is steep
# then flat — while the COST of a holdback is delayed security patches, and
# that lands hardest on pdfjs-dist, the one dependency here that parses
# untrusted input. A day captures same-day detection, which is most of it,
# at minimal patch latency. Still ~8x the 2.8 hours this was actually
# enforcing before.
#
# Override for an urgent CVE fix: bun install --minimum-release-age=0
#
# Does NOT slow normal CI: bun applies this on fresh resolution only, and
# `bun install --frozen-lockfile` installs versions already pinned in
# bun.lock (oven-sh/bun#30525). It bites exactly when a dependency changes
# — which is the moment worth gating.
#
# Dependabot's own `cooldown` in .github/dependabot.yml is set to the same
# 24 hours so it never proposes a bump this would then refuse to install.
[install]
minimumReleaseAge = 86400

# Test-run isolation: no test may reach the developer's real app settings
# file. This is half of the guard; the other half is root .env.test. See
# tests/isolate-app-settings.ts for what each half does and why both exist.
# The second preload does the same for Calibre's settings folder, with its
# own line in .env.test; tests/isolate-calibre-config.ts explains it.
# The third removes the pdf.js decoder folder the engine unpacks into the
# system temp folder, which its own exit handler cannot do under bun test;
# tests/remove-pdfjs-decoders.ts explains it.
[test]
preload = ["./tests/isolate-app-settings.ts", "./tests/isolate-calibre-config.ts", "./tests/remove-pdfjs-decoders.ts"]
