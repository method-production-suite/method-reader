[package]
name = "screepub-desktop"
version = "0.9.0"
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-or-later"
publish = false
description = "Screepub desktop shell. A window around the engine; no logic lives here."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# serde_json is here for ONE reason, and no source file in this crate may
# name it: `tauri::generate_context!` embeds the `plugins` block of
# tauri.conf.json (the updater's endpoint and public key) as
# `::serde_json::Value` literals, and the build fails without the crate.
# Measured 2026-09-21, the day the updater plugin arrived; until then the
# rule was "not linked at all". The engine's answer is still an opaque
# string on its way to the frontend: a JSON parser that nothing calls
# parses nothing, and tests/desktop-shell.test.ts fails the moment a .rs
# file mentions it.
serde_json = "1"
# `features = []` is not decoration and must not be tidied away: the Tauri
# CLI derives these lists from tauri.conf.json and writes them back on every
# `cargo tauri build`. Committed in the spelling the CLI produces, the
# rewrite is a no-op and a developer who bundles locally gets no unexplained
# diff. If tauri.conf.json ever gains a feature-bearing option the CLI will
# rewrite these again -- which is why desktop.yml still runs its
# `git diff --exit-code` BEFORE the bundle step and not after.
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.5"
# Transport for the updater, and nothing else: fetch latest.json, verify the
# minisign signature, download, swap the bundle. WHETHER to update is the
# engine's call (src/update/compare.ts); this crate never compares versions.
# 2.12.0 is the version whose source the platform-key rule and the macOS
# install path were read off; the lockfile pins it.
tauri-plugin-updater = "2.12.0"
# Restart after an update, and nothing else. The updater swaps the bundle and
# stops on macOS; this is what brings the new version up, once the window
# says the engine is idle. Approved by the owner 2026-09-23, after 0.7.2
# installed itself and the window kept running 0.7.1 with nothing on screen
# to say why. Only `restart` is granted (capabilities/default.json); the
# plugin's `exit` is not. 2.3.1 is the version whose source was read.
tauri-plugin-process = "2.3.1"
